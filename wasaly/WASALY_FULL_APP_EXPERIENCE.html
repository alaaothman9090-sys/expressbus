:13,"chapterTitle":"رفض الاستلام وتعذّر التسليم","owner":"العمليات","approver":"المؤسس","evidence":"مدعومة بالبحث","doc":"مسودة","tags":["مسودة","مدعومة بالبحث","قرار المؤسس مطلوب","مراجعة قانونية مطلوبة","مراجعة مالية مطلوبة","تجربة تشغيلية مطلوبة","محجوبة تشغيليًا"],"where":"الباب الثاني — الفصل 13 (أهم فصل تشغيلي في الملف كله)، ومرتبطة بالفصل 53 (OPS_002) والفصل 71 (نموذج المسؤولية المالية) والفصل 128 (12 حالة كاش)","open":"FDR-0001 (مصير الطلب والبضاعة والمال) · FDR-0002 (تعويض الكابتن) · FDR-0007 (فئات التجربة) · FDR-0011 (سلّم التقييد) · PAR-0001 (عدد المكالمات) · PAR-0002 (مدة الانتظار) · LDG-0001 · LDG-0006","summary":["بص، ده أهم موقف في الشركة كلها، والملف نفسه بيقول كده. الموقف: الكابتن معاه الطلب، وصل عند العميل، وما عرفش يسلّم. يمكن العميل رفض، يمكن ما ردش، يمكن العنوان غلط، يمكن حصلت حاجة.","السيستم شايف حدث واحد: «الكابتن ما عرفش يسلّم». لكن الملف بيقول إن الحدث ده بيخبي 5 حكايات مختلفة تمامًا، ولكل حكاية علاج مختلف ومين يدفع مختلف. ومعاملتهم كأنهم حاجة واحدة هي «أصل الظلم»."],"fdr":["FDR-0001","FDR-0002","FDR-0007","FDR-0011"],"val":[],"par":["PAR-0001","PAR-0002"]},{"id":"CUSTOMER_004","name":"الاسترداد والاستبدال وإعادة التسليم","support":"الكود يخالف القاعدة","readiness":"محجوبة تشغيليًا","priority":"P0","chapter":12,"chapterTitle":"الاسترداد وإعادة التسليم والاستبدال","owner":"خدمة العملاء","approver":"المؤسس","evidence":"أدلة متعارضة","doc":"مسودة","tags":["مسودة","قرار المؤسس مطلوب","مراجعة قانونية مطلوبة","مراجعة مالية مطلوبة","محجوبة تشغيليًا"],"where":"الباب الثاني — الفصل 12، ومعاها الفصل 14 «النقص والصنف الخاطئ والتالف» (صفحة 34)، ومرتبطة بالفصل 63 (FIN_002) والفصل 101 (LEGAL_004)","open":"PAR-0004 (حد صلاحية الاسترداد) · VAL-0004 (الاسترداد لقسيمة) · VAL-0002 (رسوم توصيل الاستبدال) · VAL-0001 · FDR-0010 (إصدار رصيد) · PAR-0025 (نافذة النزاع 24 ساعة)","summary":["بص، لو فيه حاجة غلط في الطلب، العميل عنده 3 علاجات: فلوسه ترجع، أو الحاجة تتبعت تاني، أو تتبدل بالصح. والسياسة بتقول 3 حاجات أساسية: 1. العميل ما يدفعش ولا مليم زيادة في أي علاج من التلاتة — ولا حتى رسوم توصيل للاستبدال. 2. الفلوس ترجع بنفس الطريقة اللي اتدفعت بيها. اللي دفع كاش ياخد كاش. وما يتحولش الاسترداد لرصيد في التطبيق إلا لو العميل هو اللي اختار كده صراحة. 3. الاسترداد ليه 4 مراحل، وما نقولش للعميل «تم» غير لما الفلوس توصله فعلًا.","ومعاها الفصل 14 اللي بيفرق بين 3 مشاكل: ناقص (صنف ما وصلش)، غلط (وصل غير اللي طلبته)، تالف (وصل بايظ)."],"fdr":["FDR-0010"],"val":["VAL-0002","VAL-0004"],"par":["PAR-0004"]},{"id":"CUSTOMER_005","name":"التعويض وحسن النية","support":"غير مبنية","readiness":"محجوبة تشغيليًا","priority":"P1","chapter":15,"chapterTitle":"التعويض التقديري وحسن النية","owner":"خدمة العملاء","approver":"المؤسس","evidence":"جزئية","doc":"مسودة","tags":["مسودة","قرار المؤسس مطلوب","مراجعة قانونية مطلوبة","محجوبة تشغيليًا"],"where":"الباب الثاني — الفصل 15 (ومرتبطة بالفصل 69 FIN_008 والفصل 101 LEGAL_004 والنموذج 8)","open":"PAR-0005 (حد منح حسن النية) · FDR-0010 (إصدار رصيد) · VAL-0008 (البنك المركزي)","summary":["بص، فيه فرق كبير بين حاجتين: - الاسترداد: حقك. دفعت 25 جنيه في بيبسي ما وصلش، يبقى الـ25 ترجعلك. نقطة. - التعويض التقديري: هدية زيادة. البيبسي رجع فلوسه، بس كمان الأكل اتأخر ساعة وبوّظ عزومتك، فالشركة «من نفسها» قالت «خد خصم 30 جنيه على طلبك الجاي».","السياسة بتقول: الاسترداد الأول دايمًا، وبعدين نفكر في التعويض. وممنوع نعرض هدية على عميل مكان فلوسه المستحقة."],"fdr":["FDR-0010"],"val":["VAL-0008"],"par":["PAR-0005"]},{"id":"CUSTOMER_006","name":"إساءة الاستخدام وقيود الحساب","support":"غير مبنية","readiness":"محجوبة تشغيليًا","priority":"P1","chapter":16,"chapterTitle":"إساءة الاستخدام وقيود حساب العميل","owner":"المخاطر والتحقيق","approver":"المؤسس","evidence":"جزئية","doc":"مسودة","tags":["مسودة","قرار المؤسس مطلوب","تجربة تشغيلية مطلوبة","محجوبة تشغيليًا"],"where":"الباب الثاني — الفصل 16 (ومرتبطة بالفصول 80–84 في باب المخاطر، والقرار FDR-0011)","open":"FDR-0011 (سلّم التقييد) · PAR-0016 (مدة تقييد الكاش) · LDG-0001 (معدل الرفض في سمالوط)","summary":["بص، السياسة دي بترد على سؤال: «طب واللي بيستغلنا؟». العميل اللي بيطلب كاش ويرفض 5 مرات، نعمل معاه إيه؟","والإجابة: بالراحة جدًا، وخطوة خطوة، ومن غير ما نظلم حد. الملف بيقسم الشك لـ4 درجات، وما بيسمحش بأي عقوبة غير في الدرجة الأخيرة:"],"fdr":["FDR-0011"],"val":[],"par":["PAR-0016"]},{"id":"CUSTOMER_007","name":"المشتري البعيد والمستلم","support":"غير محقَّقة","readiness":"قابلة للتشغيل يدويًا","priority":"P1","chapter":9,"chapterTitle":"المشتري والمستلم — من يملك القرار","owner":"خدمة العملاء","approver":"المؤسس","evidence":"جزئية","doc":"مسودة","tags":["مسودة","قرار المؤسس مطلوب"],"where":"الباب الثاني — الفصل 9 (ومرتبطة بالفصل 35 والحالة SCN-008 والحادثة INC-0004)","open":"","summary":["بص، كتير من الطلبات بيشتريها حد ويستلمها حد تاني. ابن بيطلب لأمه، زوج بيطلب للبيت وهو في الشغل، صاحب بيبعت هدية. السيستم شايف «حساب واحد»، لكن في الحقيقة فيه شخصين، ولكل واحد وضع مختلف.","السياسة بتقول ببساطة: المشتري بيقرر، والمستلم بيستلم. المستلم يقدر يستلم أو يرفض يستلم — وبس. أي حاجة تانية (إلغاء، بديل، فلوس، تغيير عنوان) لازم نرجع فيها للمشتري."],"fdr":[],"val":[],"par":[]},{"id":"CUSTOMER_008","name":"التواصل مع العميل","support":"مدعومة جزئيًا","readiness":"تحتاج تغييرًا تقنيًا","priority":"P0","chapter":115,"chapterTitle":"مبادئ التواصل","owner":"خدمة العملاء","approver":"المؤسس","evidence":"مدعومة بالبحث","doc":"مسودة","tags":["مسودة","مدعومة بالبحث"],"where":"الباب الرابع عشر — الفصل 115 «مبادئ التواصل»، ومعاه الفصول 116 (اللهجة) و117 (المواقف الصعبة) و118 (ما لا يُقال) والفصل 18 (حدود ما يُوعد به العميل) ومكتبة الرسائل (الباب 18)","open":"","summary":["بص، السياسة دي عن إزاي بنكلم العميل. والملف بيقول جملة مهمة جدًا: «أكثر الشكاوى التي تتحول إلى نزاع لا تتحول بسبب الخطأ نفسه، بل بسبب الجملة التي قيلت بعده».","السياسة فيها 6 مبادئ، وجدول «مين يكلم مين»، وقواعد للهجة (والعامية المصرية مقبولة مع العميل)، وقايمة جمل ممنوعة، و15 رسالة جاهزة للعميل."],"fdr":[],"val":[],"par":[]},{"id":"MERCHANT_001","name":"ضمّ التاجر والتحقق منه","support":"مدعومة جزئيًا","readiness":"قابلة للتشغيل يدويًا","priority":"P0","chapter":19,"chapterTitle":"ضمّ التاجر والتحقق منه","owner":"علاقات التجار","approver":"المؤسس","evidence":"جزئية","doc":"مسودة","tags":["مسودة","مراجعة قانونية مطلوبة","تجربة تشغيلية مطلوبة"],"where":"الباب الثالث — الفصل 19 (ومرتبطة بالفصل 13.5 جدول الفئات والقرار FDR-0007)","open":"LDG-0006 (هل ينفع نرجّع أو نبيع صنف مرفوض في كل فئة؟) · FDR-0007 (فئات التجربة)","summary":["بص، قبل ما أي مطعم أو محل يبان في التطبيق، لازم نعمل حاجتين: نتأكد منه، ونتفق معاه على القواعد. والفكرة الذكية في السياسة: لحظة الضم هي اللحظة الوحيدة الهادية اللي تقدر تتفق فيها على كل حاجة. أي حاجة ما تتفقش عليها دلوقتي، هتتخانقوا عليها بعدين «على الباب وقت الأزمة»."],"fdr":["FDR-0007"],"val":[],"par":[]},{"id":"MERCHANT_002","name":"التوفّر والطاقة الاستيعابية ووضع الانشغال","support":"مدعومة جزئيًا","readiness":"مرشّحة بعد الاعتماد","priority":"P0","chapter":20,"chapterTitle":"التوفّر والطاقة الاستيعابية","owner":"علاقات التجار","approver":"المؤسس","evidence":"مدعومة بالبحث","doc":"مسودة","tags":["مسودة","مدعومة بالبحث","تجربة تشغيلية مطلوبة"],"where":"الباب الثالث — الفصل 20 (ومرتبطة بالفصل 55 الطلبات المجدولة)","open":"","summary":["بص، المطعم مش بس «مفتوح» أو «مقفول». فيه حالة تالتة مهمة جدًا: «مشغول». يعني: «أنا شغال، بس عندي زحمة، فالأكل هياخد وقت أطول». والسياسة بتقول إن التاجر من حقه يغيّر حالته في أي وقت، وما يتعاقبش إنه قال «مشغول»، والعميل لازم يشوف الحالة الحقيقية."],"fdr":[],"val":[],"par":[]},{"id":"MERCHANT_003","name":"التزام التاجر بالطلب واستثناءات الرفض","support":"مدعومة","readiness":"مرشّحة بعد الاعتماد","priority":"P0","chapter":21,"chapterTitle":"التزام التاجر بالطلب واستثناءات الرفض","owner":"علاقات التجار","approver":"المؤسس","evidence":"مدعومة بالبحث","doc":"مسودة","tags":["مسودة","مدعومة بالبحث","قرار المؤسس مطلوب","تجربة تشغيلية مطلوبة"],"where":"الباب الثالث — الفصل 21 (ومرتبطة بالقرار FDR-0003 والتعارض CFL-0006)","open":"FDR-0003 (نموذج الالتزام) · LDG-0003 (هل تجار سمالوط يقبلوا نموذج ملزم؟)","summary":["بص، السؤال هنا: لما العميل يطلب، هل التاجر ملزم يعمل الطلب؟ ولا من حقه يرفض؟","النموذج المطبق النهارده: القبول الصريح. الطلب يفضل مستني لحد ما التاجر يقبله، والتاجر يقدر يلغيه قبل ما يبدأ يحضّر. ولو ما ردش خلال المهلة، الطلب يتلغي أوتوماتيك وفلوس العميل ترجع كاملة، والواقعة تتسجل على التاجر «بوصف محايد»."],"fdr":["FDR-0003"],"val":[],"par":[]},{"id":"MERCHANT_004","name":"التحضير والتسليم للكابتن","support":"مدعومة جزئيًا","readiness":"قابلة للتشغيل يدويًا","priority":"P1","chapter":22,"chapterTitle":"التحضير والتسليم للكابتن","owner":"علاقات التجار","approver":"المؤسس","evidence":"جزئية","doc":"مسودة","tags":["مسودة"],"where":"الباب الثالث — الفصل 22 (ومرتبطة بالفصل 35 CAPTAIN_005 والفصل 60 السجلات اليدوية)","open":"","summary":["بص، السياسة دي عن لحظة واحدة: المطعم بيدي الكيس للكابتن. والملف بيقول إنها «أهم لحظة غير موثّقة في المنظومة كلها». النهارده السيستم بيسجل الوقت بس — مش بيسجل إيه اللي جوه الكيس، ولا حالة التغليف، ولا عدد الأصناف."],"fdr":[],"val":[],"par":[]},{"id":"MERCHANT_005","name":"تأخر التاجر وإخفاقه","support":"مدعومة جزئيًا","readiness":"قابلة للتشغيل يدويًا","priority":"P1","chapter":23,"chapterTitle":"تأخر التاجر وإخفاقه","owner":"علاقات التجار","approver":"المؤسس","evidence":"جزئية","doc":"مسودة","tags":["مسودة","قرار المؤسس مطلوب"],"where":"الباب الثالث — الفصل 23 (ومرتبطة بالفصل 51 سجل الانتقالات والفصل 71 نموذج المسؤولية)","open":"","summary":["بص، لما الطلب يتأخر، السؤال الأول: الوقت ضاع فين؟ والسياسة بتقول: نعرف ده من السجل — مش من انطباع حد. وده من الحالات النادرة في الملف كله اللي فيها «مسار تحميل واضح»: لو السجل أثبت إن المطعم هو اللي أخّر تأخير كبير، التكلفة ممكن تتنقل له."],"fdr":[],"val":[],"par":[]},{"id":"MERCHANT_006","name":"جودة المنتج وسلامة الغذاء","support":"غير مبنية","readiness":"محجوبة تشغيليًا","priority":"P0","chapter":24,"chapterTitle":"جودة المنتج وسلامة الغذاء","owner":"علاقات التجار","approver":"المؤسس","evidence":"مدعومة بالبحث","doc":"مسودة","tags":["مسودة","مدعومة بالبحث","مراجعة قانونية مطلوبة","محجوبة تشغيليًا"],"where":"الباب الثالث — الفصل 24 (ومرتبطة بالفصل 58 إدارة الحوادث والفصل 97 حماية المستهلك)","open":"VAL-0005 (واجب إخطار جهاز حماية المستهلك)","summary":["بص، لو عميل قال «الأكل ده تعبني» — ده مش شكوى عادية. السياسة بتقول: نوقف الصنف ده من البيع فورًا، قبل ما نتأكد — مش بعد. وبعدين نبلغ التاجر، ونبلغ المؤسس، ونعرف مين تاني أكل من نفس الصنف في نفس اليوم ونكلمهم، وبعدين نتحقق ونقرر.","والجملة المهمة: «إيقاف العرض إجراء حماية، وليس إدانة للتاجر ولا اعترافًا بمسؤولية. ويُقال له ذلك صراحةً»."],"fdr":[],"val":["VAL-0005"],"par":[]},{"id":"MERCHANT_007","name":"التسوية والخصومات والنزاعات","support":"مدعومة جزئيًا","readiness":"تحتاج تغييرًا تقنيًا","priority":"P0","chapter":26,"chapterTitle":"تسوية التاجر","owner":"المالية والضبط","approver":"المؤسس","evidence":"مدعومة بالبحث","doc":"مسودة","tags":["مسودة","مدعومة بالبحث","قرار المؤسس مطلوب","مراجعة مالية مطلوبة"],"where":"الباب الثالث — الفصل 26 «تسوية التاجر»، ومعاه الفصل 27 «غرامة التأخر في التسوية» (ص 50) والفصل 28 «النزاع مع التاجر» (ص 51)، ومرتبطة بالفصل 64 (FIN_003) والقرار FDR-0006","open":"PAR-0006 (مهلة التسوية 48 ساعة) · PAR-0007/0008/0009 (الغرامة) · FDR-0006 · VAL-0012 (المحاسب) · CFL-0007 (تعارض المعرّفات)","summary":["بص، في طلبات الكاش، الكابتن بيحصّل الفلوس كلها من العميل نيابة عن وصلي. يعني فلوس المطعم بتبقى عند وصلي. التسوية هي إن وصلي ترجّع للمطعم حقه، بعد ما تخصم عمولتها. والسياسة بتقول: التسوية من سجل الطلبات المسلّمة مش من تقدير، وفي مواعيد ثابتة، وبكشف مفصّل، وما يتخصمش من التاجر أي مبلغ من غير بند متفق عليه وإخطار مسبق ودليل.","ومعاها 3 حاجات: الغرامة اللي وصلي بتدفعها لو اتأخرت، والنزاع لو التاجر معترض."],"fdr":[],"val":["VAL-0012"],"par":["PAR-0006"]},{"id":"MERCHANT_008","name":"الإنفاذ والتظلّم للتاجر","support":"غير مبنية","readiness":"قابلة للتشغيل يدويًا","priority":"P1","chapter":29,"chapterTitle":"الإنفاذ والتظلّم للتاجر","owner":"علاقات التجار","approver":"المؤسس","evidence":"جزئية","doc":"مسودة","tags":["مسودة","قرار المؤسس مطلوب"],"where":"الباب الثالث — الفصل 29 (ومرتبطة بالمعيار الموحد 6.4 والفصل 84 RISK_003)","open":"","summary":["بص، لو تاجر بيغلط باستمرار (بيتأخر، الج ":"محجوبة تشغيليًا","priority":"P0","chapter":32,"chapterTitle":"التوفّر وقبول العروض ورفضها","owner":"عمليات الكباتن","approver":"المؤسس","evidence":"أدلة متعارضة","doc":"مسودة","tags":["مسودة","قرار المؤسس مطلوب","مراجعة قانونية مطلوبة","محجوبة تشغيليًا"],"where":"الباب الرابع — الفصل 32 (ومرتبطة مباشرة بالفصل 33 CAPTAIN_001)","open":"","summary":["بص، السياسة دي بتقول 4 حاجات بسيطة: الكابتن من حقه يقبل أو يرفض أي عرض. والرفض ما عليهوش أي عقوبة ولا أثر مالي. ووصلي ما تبنيش أي حاجة تقيس نسبة قبوله أو ساعات أونلاين. وما نعاقبوش بشكل ملتوي بإننا نقلل العروض اللي بتوصله لأنه رفض."],"fdr":[],"val":[],"par":[]},{"id":"CAPTAIN_004","name":"الإلغاء بعد القبول","support":"غير مبنية","readiness":"محجوبة تشغيليًا","priority":"P1","chapter":34,"chapterTitle":"الإلغاء بعد القبول","owner":"عمليات الكباتن","approver":"المؤسس","evidence":"جزئية","doc":"مسودة","tags":["مسودة","قرار المؤسس مطلوب","محجوبة تشغيليًا"],"where":"الباب الرابع — الفصل 34 (ومرتبطة بالحادثة INC-0029 والحالة SCN-034)","open":"","summary":["بص، قبول العرض «التزام». بس الحياة فيها ظروف. السياسة بتقول: الإلغاء بعد القبول بيتسجل، بس مش مخالفة في ذاته، لأن ليه أسباب مشروعة كتير. والمهم: نعيد إسناد الطلب فورًا، ونبلغ العميل بالتأخير الحقيقي، وما نخصمش من الكابتن حاجة."],"fdr":[],"val":[],"par":[]},{"id":"CAPTAIN_005","name":"الاستلام والتسليم وإثباتهما","support":"مدعومة جزئيًا","readiness":"محجوبة تشغيليًا","priority":"P0","chapter":35,"chapterTitle":"الاستلام والتسليم وإثباتهما","owner":"عمليات الكباتن","approver":"المؤسس","evidence":"مدعومة بالبحث","doc":"مسودة","tags":["مسودة","مدعومة بالبحث","قرار المؤسس مطلوب","تجربة تشغيلية مطلوبة","محجوبة تشغيليًا"],"where":"الباب الرابع — الفصل 35 (ومرتبطة بالفصل 22 MERCHANT_004 والفصل 13 CUSTOMER_003)","open":"FDR-0001 · FDR-0002","summary":["بص، السياسة دي عن لحظتين: الكابتن بيستلم من المطعم، والكابتن بيسلّم للعميل. وإيه اللي بيثبت إن اللحظتين دول حصلوا صح. وكمان فيها 5 قواعد مهمة للكابتن عند الباب."],"fdr":[],"val":[],"par":[]},{"id":"CAPTAIN_006","name":"النقد والعهدة "الباب السادس — الفصل 51، والفصل 52 (ص 80)","open":"","summary":["بص، دي «خريطة الطلب» من أول ما العميل يضغط «اطلب» لحد ما الطلب يتقفل. 8 محطات: إنشاء ← قبول ← تحضير ← إسناد ← استلام ← نقل ← تسليم ← إتمام. وفي كل محطة حاجة بتتسجل. ومعاها قواعد «آلة الحالات»: كل حركة ليها صاحب، ومفيش حركة غير معرّفة، وكل حركة بتتكتب في سجل التدقيق، ومفيش تعديل للسجل بأثر رجعي (التصحيح بقيد جديد)."],"fdr":[],"val":[],"par":[]},{"id":"OPS_002","name":"فشل التسليم","support":"غير مبنية","readiness":"محجوبة تشغيليًا","priority":"P0","chapter":53,"chapterTitle":"فشل التسليم — الجانب التشغيلي","owner":"العمليات","approver":"المؤسس","evidence":"مدعومة بالبحث","doc":"مسودة","tags":["مسودة","مدعومة بالبحث","قرار المؤسس مطلوب","مراجعة مالية مطلوبة","تجربة تشغيلية مطلوبة","محجوبة تشغيليًا"],"where":"الباب السادس — الفصل 53 (ومرتبطة مباشرة بالفصل 13 CUSTOMER_003)","open":"FDR-0001 · LDG-0001 · LDG-0005","summary":["بص، CUSTOMER_003 بتقول «إزاي نتعامل مع العميل» لما التسليم يفشل. السياسة دي بتقول «العمليات تعمل إيه من جوه»: 8 خطوات، وسجل لكل واقعة، ومؤشرات نقيس بيها. وأهم جملة: السجل ده «غير موجود في النظام، ويجب أن يبدأ يدويًا من أول يوم تجربة. لا يحتاج كودًا ولا قرارًا من المؤسس — يحتاج دفترًا وقرارًا بأن يُملأ»."],"fdr":["FDR-0001"],"val":[],"par":[]},{"id":"OPS_003","name":"الطلب متعدد المتاجر","support":"غير محقَّقة","readiness":"محجوبة تشغيليًا","priority":"P2","chapter":54,"chapterTitle":"الطلب متعدد المتاجر","owner":"العمليات","approver":"المؤسس","evidence":"جزئية","doc":"مسودة","tags":["مسودة","قرار المؤسس مطلوب","تجربة تشغيلية مطلوبة","محجوبة تشغيليًا"],"where":"الباب السادس — الفصل 54 (وحالاتها SCN-046 لـ050)","open":"PAR-0019 (فترة التنسيق)","summary":["بص، الفكرة إن العميل يطلب من 3 محلات في طلب واحد. السياسة بتقول: الخدمة دي محجوبة — مش شغالة ومش هتتشغل — لحد ما نتأكد إن السيستم فيه «طلبات فرعية»، ونحدد «فترة التنسيق». لأن «الطلب من أكثر من متجر ليس طلبًا واحدًا أكبر: هو عدة التزامات مستقلة داخل غلاف واحد»."],"fdr":[],"val":[],"par":["PAR-0019"]},{"id":"OPS_004","name":"الطلب المجدول وطلبات المناسبات","support":"غير محقَّقة","readiness":"محجوبة تشغيليًا","priority":"P2","chapter":55,"chapterTitle":"الطلب المجدول وطلبات المناسبات","owner":"العمليات","approver":"المؤسس","evidence":"جزئية","doc":"مسودة","tags":["مسودة","قرار المؤسس مطلوب","مراجعة قانونية مطلوبة","محجوبة تشغيليًا"],"where":"الباب السادس — الفصل 55 (وحالاتها SCN-051 لـ055)","open":"PAR-0020 (أفق الحجز)","summary":["بص، «الجدولة وعد بطاقة في المستقبل». يعني لما تقول لأحمد «التورتة هتوصل بكرة الساعة 8»، انت بتوعده إن الحلواني هيكون فاضي، وإن فيه كابتن فاضي. والسيستم النهارده ما عندوش فكرة «حجز طاقة» خالص. عشان كده الخدمة محجوبة. و«طلب المناسبة على وجه الخصوص لا يُقبل بترتيب غير رسمي على المسؤولية الشخصية، لأن الضرر يقع على العميل لا على من قبله»."],"fdr":[],"val":[],"par":["PAR-0020"]},{"id":"OPS_005","name":"إدارة الاستثناءات","support":"مدعومة جزئيًا","readiness":"قابلة للتشغيل يدويًا","priority":"P1","chapter":56,"chapterTitle":"إدارة الاستثناءات","owner":"العمليات","approver":"المؤسس","evidence":"جزئية","doc":"مسودة","tags":["مسودة"],"where":"الباب السادس — الفصل 56 (ومرتبطة بالقسم 4.4 وGOV_002 والنموذج 9)","open":"","summary":["بص، «الاستثناء» يعني نخرج عن القاعدة مرة، لسبب مكتوب ولمدة محددة. السياسة بتقول إزاي: طلب مسبّب ← اعتماد من مستوى أعلى من اللي حط القاعدة ← تنفيذ وتسجيل ← ينتهي لوحده لما المدة تخلص ← ونقرأ سجل الاستثناءات في كل مراجعة. والجملة المهمة: «تكرار الاستثناء نفسه مرتين ليس دليلًا على أن الحالات استثنائية. هو دليل على أن القاعدة خاطئة»."],"fdr":[],"val":[],"par":[]},{"id":"OPS_006","name":"استمرارية الخدمة","support":"مدعومة جزئيًا","readiness":"تحتاج تغييرًا تقنيًا","priority":"P1","chapter":57,"chapterTitle":"استمرارية الخدمة","owner":"التقنية","approver":"المؤسس","evidence":"مدعومة بالبحث","doc":"مسودة","tags":["مسودة","مدعومة بالبحث"],"where":"الباب السادس — الفصل 57 (ومرتبطة بالحادثة INC-0046 والحالة SCN-068)","open":"","summary":["بص، السياسة دي بترد على سؤال: «لو حاجة وقفت، نعمل إيه؟». التطبيق وقع؟ التجار مش شايفين الطلبات؟ مفيش كباتن؟ الكهربا قاطعة؟ والقاعدة الحاكمة: «لا يُترك طلب معلّقًا بلا قرار وبلا إخطار» — «والعميل الذي يعرف أن هناك مشكلة أقل ضررًا من العميل الذي ينتظر بلا خبر»."],"fdr":[],"val":[],"par":[]},{"id":"OPS_007","name":"إدارة الحوادث","support":"غير مبنية","readiness":"قابلة للتشغيل يدويًا","priority":"P0","chapter":58,"chapterTitle":"إدارة الحوادث","owner":"العمليات","approver":"المؤسس","evidence":"مدعومة بالبحث","doc":"مسودة","tags":["مسودة","مدعومة بالبحث","مراجعة قانونية مطلوبة"],"where":"الباب السادس — الفصل 58 (ومرتبطة بالنماذج 2 و15 و16 و17 و18)","open":"FDR-0008 (تغطية الدعم) · VAL-0005 (واجب الإخطار)","summary":["بص، «الحادث» حاجة أكبر من شكوى عادية: حد اتأذى، أكل عمل تسمم، بيانات اتسربت، فلوس كتير ناقصة، أو الخدمة وقفت. السياسة بتصنّف الحوادث لـ5 أنواع وبتقول مين يتبلغ فورًا، وفيها 5 قواعد. أهمها: السلامة أولًا — يُؤمَّن الأشخاص قبل جمع أي دليل."],"fdr":["FDR-0008"],"val":["VAL-0005"],"par":[]},{"id":"FIN_001","name":"ضبط الدفع عند الاستلام والنقدية","support":"مدعومة جزئيًا","readiness":"محجوبة تشغيليًا","priority":"P0","chapter":62,"chapterTitle":"ضبط الدفع عند الاستلام والنقدية","owner":"المالية والضبط","approver":"المؤسس","evidence":"مدعومة بالبحث","doc":"مسودة","tags":["مسودة","مدعومة بالبحث","قرار المؤسس مطلوب","مراجعة قانونية مطلوبة","مراجعة مالية مطلوبة","محجوبة تشغيليًا"],"where":"الباب السابع — الفصل 62 (ومرتبطة بالفصل 36 CAPTAIN_006 والنماذج 3 و4)","open":"PAR-0013 (1500 جنيه) · LDG-0010 (نسبة الأوراق المزيفة ونزاع الفكة في سمالوط)","summary":["بص، CAPTAIN_006 بتتكلم عن الكاش من ناحية «الكابتن». السياسة دي بتتكلم عنه من ناحية «خزنة الشركة»: الكاش بيمشي إزاي من إيد لإيد، وبيتسمى إيه في الدفاتر في كل مرحلة. وفيها 5 قواعد: حد يومي للعهدة — توريد يومي بسجل موقّع من الطرفين — ما يتحصّلش من العميل غير المعلن — الفكة مسؤولية المنصة — الورقة المشكوك فيها: لا اتهام ولا مصادرة وتصعيد."],"fdr":[],"val":[],"par":["PAR-0013"]},{"id":"FIN_002","name":"الضبط المالي للاسترداد","support":"الكود يخالف القاعدة","readiness":"محجوبة تشغيليًا","priority":"P0","chapter":63,"chapterTitle":"الضبط المال  FDR-0005 · FDR-0001 · LDG-0002 (تكلفة فشل التسليم لكل فئة)","summary":["بص، السياسة دي بتجاوب على سؤالين: 1. الفروق الصغيرة نعمل فيها إيه؟ نشطبها («إعدام») بقرار، تحت حد معين، والشخص اللي عد ما يشطبش — ونقرا المجموع كل شهر. 2. الخسارة الكبيرة مين يشيلها؟ مفيش إجابة واحدة — لازم نمشي في «6 أسئلة» (الفصل 71)."],"fdr":["FDR-0001","FDR-0005"],"val":[],"par":["PAR-0021"]},{"id":"FIN_008","name":"ضبط الرصيد والائتمان الترويجي","support":"الكود يخالف القاعدة","readiness":"محجوبة تشغيليًا","priority":"P1","chapter":69,"chapterTitle":"ضبط الرصيد والائتمان الترويجي","owner":"المالية والضبط","approver":"المؤسس","evidence":"أدلة متعارضة","doc":"مسودة","tags":["مسودة","قرار المؤسس مطلوب","مراجعة قانونية مطلوبة","مراجعة مالية مطلوبة","محجوبة تشغيليًا"],"where":"الباب السابع — الفصل 69 (ومرتبطة بالفصل 3.4 «أربعة أشياء تُسمى محفظة» والفصل 101 LEGAL_004)","open":"VAL-0008 · FDR-0010 · PAR-0005 · PAR-0024 (صلاحية القسيمة)","summary":["بص، كلمة «محفظة» بتتقال على 4 حاجات مختلفة، والسياسة بتحط لكل واحدة ضابط:","والقاعدة لحد الإجابة: «لا يُصدر أي رصيد للعميل»."],"fdr":["FDR-0010"],"val":["VAL-0008"],"par":["PAR-0005","PAR-0024"]},{"id":"FIN_009","name":"الاعتمادات المالية","support":"غير مبنية","readiness":"محجوبة تشغيليًا","priority":"P0","chapter":70,"chapterTitle":"الاعتمادات المالية","owner":"المالية والضبط","approver":"المؤسس","evidence":"جزئية","doc":"مسودة","tags":["مسودة","قرار المؤسس مطلوب","محجوبة تشغيليًا"],"where":"الباب السابع — الفصل 70 (ومرتبطة بمصفوفة الصلاحيات — الفصل 122 — والقرار FDR-0012)","open":"","summary":["بص، «مين يوافق على أي صرفة؟». المبدأ: كل قرار مالي ليه مستوى اعتماد حسب قيمته. بس الحدود مش محددة، فلحد ما تتحدد: المؤسس بيعتمد كل قرار مالي — «وهو وضع بطيء عمدًا، وأفضل من حد مخترع». وأي خصم من الكابتن: محظور لحد الإجابة القانونية."],"fdr":[],"val":[],"par":[]},{"id":"SUP_001","name":"سياسة تشغيل الدعم","support":"غير مبنية","readiness":"محجوبة تشغيليًا","priority":"P0","chapter":72,"chapterTitle":"تشغيل الدعم","owner":"خدمة العملاء","approver":"المؤسس","evi ا يوجد — محجوز للمؤسس","control":"محجوز بالكامل","prohibited":false},"AUT-0018":{"id":"AUT-0018","action":"الاتصال بمحامٍ أو جهة تنظيمية","request":"أي وظيفة","execute":"المؤسس","approve":"المؤسس","review":"الحوكمة (يتولاها المؤسس)","founderOnly":true,"conflict":"لا يوجد — محجوز للمؤسس","control":"محجوز، مع استثناء صريح: بلاغ السلامة العاجل لا ينتظر اعتمادًا","prohibited":false},"AUT-0019":{"id":"AUT-0019","action":"اعتماد استثناء من سياسة","request":"أي وظيفة","execute":"العمليات","approve":"المؤسس","review":"الحوكمة (يتولاها المؤسس)","founderOnly":true,"conflict":"من يطلب الاستثناء قد يكون من يعتمده","control":"كل استثناء مؤقت بطبيعته ويُراجَع، وتكراره يفتح مراجعة السياسة","prohibited":false},"AUT-0020":{"id":"AUT-0020","action":"التصعيد في حادث سلامة","request":"أي شخص","execute":"أي شخص","approve":"لا يلزم اعتماد مسبق","review":"العمليات","founderOnly":false,"conflict":"لا يوجد — التصعيد حق لا صلاحية","control":"قاعدة قاطعة: لا يُؤجَّل التصعيد العاجل لجمع دليل ولا لانتظار اعتماد","prohibited":false}},"cfl":{"CFL-0001":{"id":"CFL-0001","title":"هل يشمل قانون العمل 14/2025 صراحةً العمل عبر المنصّات الرقمية؟","kind":"تعارض أدلة","severity":"مرتفع","resolver":"محامٍ مصري مؤهل","impact":"تحليل تصنيف الكابتن كله يقوم على نص لم يُقرأ في الجريدة الرسمية. إن كان النص يسمّي المنصّات صراحةً فالمخاطرة أعلى مما هو مقدَّر هنا."},"CFL-0002":{"id":"CFL-0002","title":"مسار استرداد الدفع عند الاستلام يناقض واجب الرد بنفس وسيلة الدفع","kind":"تعارض قانوني","severity":"حرج","resolver":"محامٍ مصري + قرار مؤسس","impact":"سلوك قائم في الإنتاج قد يخالف التزامًا قانونيًا، ويُنشئ في الوقت نفسه التزامًا مفتوحًا غير محدد المعالجة المحاسبية."},"CFL-0003":{"id":"CFL-0003","title":"نافذة النزاع 24 ساعة مقابل حق العيب 30 يومًا","kind":"تعارض قانوني","severity":"مرتفع","resolver":"محامٍ مصري + قرار مؤسس","impact":"المنتج يغلق المسار الوحيد المتاح للعميل قبل انقضاء حقه القانوني بكثير."},"CFL-0004":{"id":"CFL-0004","title":"لا توجد حالة فشل تسليم، فيُستخدم الإلغاء بديلًا عنها","kind":"DRAFTING_INCONSISTENCY","severity":"مرتفع","resolver":"قرار مؤسس ثم تغيير تقني","impact":"واقعة فشل تسليم تُسجَّل كإلغاء، فتختل العمولة والتسوية والتقارير معًا، ويصبح قياس معدل الفشل مستحيلًا."},"CFL-0005":{"id":"CFL-0005","title":"شرط قبول 80% ملزم تعاقديًا وغير قابل للقياس تقنيًا","kind":"CONTRACTUAL_CONFLICT","severity":"حرج","resolver":"قرار مؤسس + محامٍ","impact":"بندان موقَّعان يتناقضان، وأحدهما لا يمكن تطبيقه على أحد. والنافذة الزمنية لحلّه بأقل كلفة تُغلق فور بناء آلية القياس."},"CFL-0006":{"id":"CFL-0006","title":"فرضية الالتزام التلقائي للتاجر تناقض ما هو مطبَّق","kind":"BUSINESS_CONFLICT","severity":"متوسط","resolver":"قرار مؤسس","impact":"بناء سياسة على فرضية غير معتمدة ومناقضة للتطبيق ينتج وعدًا للعميل لا يسنده النظام."},"CFL-0007":{"id":"CFL-0007","title":"تصادم معرّفات القرارات يجعل أي إشارة إلى رقم قرار غامضة","kind":"DRAFTING_INCONSISTENCY","severity":"مرتفع","resolver":"قرار مؤسس","impact":"لا يمكن إثبات أن قاعدة مالية سارية مستندة إلى قرار معتمد، لأن الرقم نفسه يشير إلى قرارين."},"CFL-0008":{"id":"CFL-0008","title":"استحقاق الكابتن يُقيَّد عند التسليم فقط، بينما الرحلة الفاشلة كلفة حقيقية","kind":"BUSINESS_CONFLICT","severity":"مرتفع","resolver":"قرار مؤسس","impact":"حافز غير مقصود يحوّل فشل التسليم إلى ضغط على العميل، فتختفي المشكلة من التقارير بدل أن تُحل."},"CFL-0009":{"id":"CFL-0009","title":"فصل المهام مُدَّعى في مصفوفة الصلاحيات وغير قائم في الواقع","kind":"BUSINESS_CONFLICT","severity":"مرتفع","resolver":"قرار مؤسس","impact":"ادعاء رقابة غير موجودة أسوأ من الاعتراف بغيابها، لأنه يمنع البحث عن ضابط بديل."},"CFL-0010":{"id":"CFL-0010","title":"قرار العمل عن بُعد يشمل ويستثني منصّة التوصيل في آنٍ واحد","kind":"تعارض قانوني","severity":"متوسط","resolver":"محامٍ مصري","impact":"لا يمكن معرفة إن كان الالتزام ساريًا على موظفي وصّلي الإداريين أم لا، والقرار يُجدَّد شهريًا فالسؤال متكرر."},"CFL-0011":{"id":"CFL-0011","title":"قناة الرسائل القصيرة معطّلة بينما التحقق من الهوية يعتمد عليها","kind":"DRAFTING_INCONSISTENCY","severity":"حرج","resolver":"قرار تقني + المؤسس","impact":"كل سياسة تفترض التحقق من الرقم مبنية على قدرة غير قائمة. وهذا مانع إطلاق قبل أن يكون مشكلة سياسة."},"CFL-0012":{"id":"CFL-0012","title":"الحزمة تعد بتظلّم ومراجعة مستقلة بينما لا كيان تظلّم ولا شخص ثانٍ","kind":"BUSINESS_CONFLICT","severity":"مرتفع","resolver":"قرار مؤسس","impact":"وعد إجرائي لا يمكن الوفاء به هو أسوأ من عدم الوعد، لأنه يُفقد الثقة عند أول اختبار."}},"msgs":{"MSG-C-001":{"id":"MSG-C-001","situation":"تأخير في التحضير","written":"طلبك رقم {{ORDER_ID}} لسه بيتجهز وفيه تأخير بسيط. هنبعتلك أول ما يخرج للتوصيل.","spoken":"أنا آسف على التأخير. الطلب لسه في المطبخ. مش هقولك ميعاد مش متأكد منه — هراجع دلوقتي وأكلمك خلال {{MINUTES}} دقيقة بالوضع الحقيقي. ولو حابب تلغي دلوقتي، من حقك وهرجّعلك كل اللي دفعته.","note":"لا تعطِ موعدًا جديدًا إلا إن كان مؤكدًا من التاجر. الموعد الخاطئ الثاني أسوأ من الأول."},"MSG-C-002":{"id":"MSG-C-002","situation":"تأخير جسيم تجاوز الموعد","written":"طلبك رقم {{ORDER_ID}} اتأخر عن الميعاد المعلن. تقدر تكمّل أو تلغي من غير أي رسوم.","spoken":"الطلب اتأخر عن الميعاد اللي قلنالك عليه، وده تقصير مننا مش منك. من حقك تلغي دلوقتي من غير ما تدفع أي حاجة، ولو دفعت هيرجعلك كل المبلغ. تحب أعمل إيه؟","note":"⚠ عند التأخر عن الموعد المعلن، لا تُحتجز أي رسوم إلغاء. وقد ينشأ للعميل حق رجوع بلا نفقات."},"MSG-C-003":{"id":"MSG-C-003","situation":"الكابتن عند الباب ولا يوجد رد","written":"الكابتن واصل عندك دلوقتي ومش لاقي حد. من فضلك رد على {{CAPTAIN_PHONE}}.","spoken":"الكابتن واصل عندك من {{MINUTES}} دقيقة وبيحاول يوصلك. كل حاجة تمام؟ لو فيه أي ظرف، قولي وهحلها معاك.","note":"لا تفترض تعمّدًا. الهاتف المغلق ليس دليلًا على شيء."},"MSG-C-004":{"id":"MSG-C-004","situation":"إغلاق واقعة تعذّر تسليم","written":"معلش مقدرناش نوصّل طلب رقم {{ORDER_ID}} النهارده. مفيش أي مبلغ مستحق عليك.","spoken":"مقدرناش نوصّل الطلب النهارده. عايز أطمّنك على حاجة مهمة: مفيش أي مبلغ مستحق عليك ولا هيتخصم منك حاجة في أي طلب جاي. ولو فيه ظرف منعك، قولي وهسجّله عشان ميأثرش على حسابك.","note":"⚠ الجملة الخاصة بعدم وجود مستحق إلزامية. وهي أهم جملة في المكتبة كلها."},"MSG-C-005":{"id":"MSG-C-005","situation":"تصحيح واقعة بعد تفسير العميل","written":"شكرًا إنك وضّحتلنا. شِلنا الواقعة دي من حسابك ومش هيكون ليها أي أثر.","spoken":"شكرًا إنك قلتلي. أنا شِلت الواقعة دي خالص من حسابك ومش هتأثر على أي حاجة جاية. آسف على أي إزعاج.","note":"لا تطلب إثباتًا لظرف صحي أو عائلي. التفسير المعقول يكفي."},"MSG-C-006":{"id":"MSG-C-006","situation":"استرداد اعتُمد ولم ينفَّذ بعد","written":"طلب الاسترداد بتاع {{AMOUNT}} اتعمد وهيتنفّذ على {{REFUND_ROUTE}}. هنبعتلك أول ما يوصل.","spoken":"الاسترداد اتعمد بس لسه موصلكش. أنا مش هقولك «تم» غير لما يوصل فعلًا. هتابعه وأكلمك.","note":"⚠ لا تقل «تم» قبل وصول المال. الفرق بين «اعتُمد» و«اكتمل» هو مصدر معظم شكاوى الاسترداد."},"MSG-C-007":{"id":"MSG-C-007","situation":"استرداد اكتمل","written":"مبلغ {{AMOUNT}} وصل على {{REFUND_ROUTE}} بتاريخ {{DATE}}.","spoken":"المبلغ وصل فعلًا النهارده. لو مشوفتوش، قولي وأنا هتابع بنفسي.","note":""},"MSG-C-008":{"id":"MSG-C-008","situation":"خصم بلا طلب","written":"بنراجع عملية دفع رقم {{PAYMENT_REF}}. هنرجعلك برد خلال {{HOURS}} ساعة.","spoken":"شايف العملية وبراجعها دلوقتي. مش هقولك حاجة قبل ما أتأكد. هرجعلك خلال {{HOURS}} ساعة برد مؤكد، ولو المبلغ اتخصم فعلًا هيرجعلك بنفس طريقة الدفع.","note":"لا تُحِل العميل إلى مزوّد الدفع. المتابعة مسؤولية المنصّة."},"MSG-C-009":{"id":"MSG-C-009","situation":"صنف ناقص","written":"آسفين، الصنف {{ITEM}} مكانش في الطلب. هترجعلك قيمته {{AMOUNT}} على {{REFUND_ROUTE}}.","spoken":"آسف جدًا. هرجّعلك قيمة الصنف دلوقتي، أو أبعتهولك تاني لو تحب — اللي يريحك. مش محتاج منك أي إثبات تاني.","note":"العلاج أولًا. تحديد المسؤولية مسار منفصل لا ينتظره العميل."},"MSG-C-010":{"id":"MSG-C-010","situation":"نفاد صنف بعد القبول","written":"الصنف {{ITEM}} خلص عند التاجر. تحب نبعت {{ALTERNATIVE}} بدله، ولا نرجّعلك قيمته، ولا نلغي الطلب كله؟","spoken":"الصنف ده خلص عندهم. قدامك تلات اختيارات وأنا هعمل اللي تقوله: بديل، أو أرجّعلك قيمته، أو نلغي الطلب كله ونرجّع كل حاجة.","note":"⚠ لا يُرسَل بديل بلا موافقة صريحة، حتى لو كان أفضل وأغلى."},"MSG-C-011":{"id":"MSG-C-011","situation":"إلغاء من المنصّة","written":"اضطرينا نلغي طلب رقم {{ORDER_ID}} بسبب {{REASON}}. كل المبلغ هيرجعلك.","spoken":"آسف، اضطرينا نلغي الطلب. السبب {{REASON}} ومحصلش منك أي غلط. كل اللي دفعته هيرجعلك على {{REFUND_ROUTE}}.","note":"لا تُسمَّ الأطراف الأخرى. «حصل ظرف» لا «التاجر قفل»."},"MSG-C-012":{"id":"MSG-C-012","situation":"بلاغ يمسّ الصحة","written":"وصلنا بلاغك. اطمّنّا عليك الأول — حضرتك كويس؟","spoken":"قبل أي حاجة تانية: حضرتك كويس؟ فيه حد محتاج دكتور؟ … تمام. أنا وقّفت الصنف ده من البيع دلوقتي، وهرجّعلك كل المبلغ فورًا من غير أي شروط، وده مالوش علاقة بأي تحقيق. وهكلمك تاني أطمن عليك.","note":"⚠ الصحة أولًا. الاسترداد فوري ومنفصل عن التحقيق، وليس اعترافًا بمسؤولية."},"MSG-C-013":{"id":"MSG-C-013","situation":"إخطار بنمط قبل أي إجراء","written":"حابين نتكلم معاك بخصوص آخر {{COUNT}} طلبات. ممكن تكلمنا على {{SUPPORT_PHONE}}؟","spoken":"لاحظنا إن آخر كام طلب متوصلوش، وحابب أفهم منك إيه اللي بيحصل عشان نساعدك. مفيش أي إجراء اتاخد ومفيش عليك حاجة — أنا بس عايز أفهم.","note":"⚠ بلا اتهام وبلا تهديد. الغرض الفهم لا الإنذار."},"MSG-C-014":{"id":"MSG-C-014","situation":"انقطاع في الخدمة","written":"فيه عطل في التطبيق دلوقتي. لو عندك طلب جاري هنكلمك على طول.","spoken":"فيه عطل عندنا دلوقتي وإحنا بنشتغل عليه. طلبك رقم {{ORDER_ID}} وضعه {{STATUS}}. مش هسيبك من غير رد.","note":"أثناء الانقطاع القناة الوحيدة هي الهاتف."},"MSG-C-015":{"id":"MSG-C-015","situation":"طلب حذف بيانات","written":"وصلنا طلبك بخصوص بياناتك. هنرد عليك خلال {{DAYS}} أيام.","spoken":"طلبك وصلني. فيه حاجات نقدر نمسحها وحاجات قانون بيلزمنا نحتفظ بيها فترة، وأنا لسه بتأكد من التفاصيل بالظبط. مش هقولك كلام مش متأكد منه، وهرجعلك برد واضح.","note":"⚠ لا تَعِد بحذف كامل ولا ترفض. الالتزامات غير محققة بعد."},"MSG-M-001":{"id":"MSG-M-001","situation":"طلب لم يُردّ عليه","written":"فيه طلب رقم {{ORDER_ID}} مستني ردكم من {{MINUTES}} دقيقة.","spoken":"معاك {{NAME}} من وصّلي. فيه طلب مستنيكم. لو مشغولين دلوقتي، فعّلوا وضع الانشغال وأنا أوريكم إزاي في ثانية — ده أحسن للطرفين من إن الطلب يفضل مستني.","note":"الاتصال قبل الإلغاء التلقائي لا بعده. والمعالجة تستهدف السبب."},"MSG-M-002":{"id":"MSG-M-002","situation":"إبلاغ بواقعة تعذّر تسليم","written":"طلب رقم {{ORDER_ID}} متوصلش. الكابتن راجعلكم بالبضاعة.","spoken":"الطلب ده متوصلش والكابتن جاي لكم بيه. محتاج أتفق معاكم على كل صنف: إيه اللي ينفع يرجع وإيه اللي لأ. وهسجّل اللي هنتفق عليه.","note":"⚠ لا يُفترض قبول التاجر للإعادة. الاتفاق يُسجَّل صنفًا صنفًا."},"MSG-M-003":{"id":"MSG-M-003","situation":"شكوى نقص","written":"وصلتنا شكوى نقص في طلب {{ORDER_ID}}: {{ITEM}}. مرفق صورة العميل.","spoken":"وصلتني شكوى نقص وأنا رجّعت للعميل قيمة الصنف عشان مستناش. بعتلكم الصورة وقايمة التحضير — لو عندكم اللي يخالف ده قولولي، وفي أول مرة من غير نمط مفيش خصم.","note":"الدليل يُعرض لا يُوصف. والخصم بعد النمط لا بعد الواقعة."},"MSG-M-004":{"id":"MSG-M-004","situation":"بلاغ يمسّ الصحة","written":"وقفنا الصنف {{ITEM}} مؤقتًا لحد ما نراجع بلاغ وصلنا.","spoken":"وصلنا بلاغ عن الصنف ده وأنا وقفته مؤقتًا — ده إجراء احترازي مش حكم عليكم. محتاج أعرف منكم تفاصيل التحضير النهارده، وهرجعلكم بالنتيجة.","note":"⚠ يُوقَف الصنف لا التاجر. والإيقاف إجراء حماية لا عقوبة."},"MSG-M-005":{"id":"MSG-M-005","situation":"فرق سعر","written":"السعر المعروض لـ{{ITEM}} كان {{SHOWN}} والمحصَّل {{CHARGED}}. رجّعنا الفرق للعميل.","spoken":"السعر في الكتالوج مختلف عن اللي اتحصّل، ورجّعت الفرق للعميل على طول. محتاج نحدّث الأسعار عندكم عشان ميتكررش.","note":"السعر المعروض هو الملزم. والرد فوري بلا مناقشة."},"MSG-M-006":{"id":"MSG-M-006","situation":"كشف التسوية","written":"كشف تسوية فترة {{PERIOD}}: صافي {{NET}}. التفاصيل مرفقة.","spoken":"بعتلكم الكشف بالتفصيل: الطلبات والعمولة وأي خصم وأساسه. لو فيه حاجة مش واضحة، قولولي قبل الصرف مش بعده.","note":"الإخطار قبل الصرف لا بعده."},"MSG-M-007":{"id":"MSG-M-007","situation":"إخطار بخصم","written":"فيه خصم {{AMOUNT}} على طلب {{ORDER_ID}}. السبب {{REASON}} والدليل مرفق.","spoken":"فيه خصم على الطلب ده وأنا باعتلكم الدليل كامل. من حقكم تعترضوا، وهيراجعه حد تاني غيري. ومش هنصرف المبلغ ده لحد ما نخلص.","note":"⚠ الدليل يُرفق. والمراجع يجب أن يكون غير من قرر."},"MSG-M-008":{"id":"MSG-M-008","situation":"تأخر تسوية من المنصّة","written":"تسوية {{PERIOD}} اتأخرت. هيتصرف {{NET}} زائد غرامة تأخير {{PENALTY}}.","spoken":"إحنا اللي اتأخرنا مش انتوا، وده تقصير مننا. المبلغ هيتصرف {{DATE}} ومعاه غرامة التأخير المستحقة ليكم.","note":"الإخطار استباقي قبل أن يسأل التاجر."},"MSG-M-009":{"id":"MSG-M-009","situation":"إخطار بنمط قبل أي إجراء","written":"حابين نتكلم بخصوص {{PATTERN}} في آخر {{PERIOD}}.","spoken":"لاحظنا نمط معيّن وحابب أفهم منكم السبب قبل ما ناخد أي إجراء. مفيش قرار اتاخد لحد دلوقتي.","note":"التدرج يبدأ بالفهم لا بالإنذار."},"MSG-M-010":{"id":"MSG-M-010","situation":"تقييد مؤقت","written":"اتوقف ظهوركم مؤقتًا لمدة {{DURATION}}. السبب {{BASIS}}.","spoken":"الإيقاف مؤقت ومدته محددة، والسبب {{BASIS}}. اللي محتاجينه عشان نرفعه هو {{CONDITION}}. ومن حقكم تعترضوا وهيراجعه حد تاني.","note":"⚠ كل قرار يذكر: الأساس، والمدة، وشرط الرفع، ومسار التظلّم."},"MSG-M-011":{"id":"MSG-M-011","situation":"نتيجة اعتراض","written":"راجعنا اعتراضكم على {{SUBJECT}}. النتيجة: {{OUTCOME}}.","spoken":"راجع الاعتراض حد غير اللي اخد القرار الأول. النتيجة {{OUTCOME}} والسبب {{REASON}}.","note":"لا يُغلق اعتراض بصمت. والنتيجة تُبلَّغ بسببها."},"MSG-M-012":{"id":"MSG-M-012","situation":"انقطاع الخدمة","written":"فيه عطل عندنا. متقبلوش طلبات جديدة لحد ما نكلمكم.","spoken":"فيه عطل وأنا بكلمكم بالتليفون عشان النظام مش شغال. الطلبات اللي عندكم دلوقتي هنتصرف فيها واحد واحد، وهنسوّي ليكم اللي حضّرتوه.","note":"أثناء الانقطاع القناة هي الهاتف."},"MSG-K-001":{"id":"MSG-K-001","situation":"تعذّر التسليم","written":"سجّل المحاولات وابعت لنا. متتصرفش في البضاعة.","spoken":"تمام، سجّلت اللي حصل. البضاعة تفضل معاك لحد ما أقولك — متاكلهاش ومتديهاش لحد ومتسيبهاش. أنا هحاول أكلم العميل من رقم تاني وأرجعلك بقرار.","note":"⚠ مصير البضاعة قرار عمليات لا قرار كابتن."},"MSG-K-002":{"id":"MSG-K-002","situation":"خلاف فكّة","written":"متسيبش الطلب من غير تحصيل. كلمنا.","spoken":"متقلقش، دي مشكلة مننا إحنا مش منك ولا من العميل. متسيبش الطلب من غير فلوس ومتحطش من جيبك. استنى وأنا هحلها.","note":"⚠ القاعدة صريحة: مشكلة الفكّة مسؤولية المنصّة."},"MSG-K-003":{"id":"MSG-K-003","situation":"الشعور بخطر","written":"لو حاسس بخطر، امشي فورًا. مش محتاج إذن.","spoken":"امشي حالًا. مش عايز تفاصيل دلوقتي ومش محتاج تثبتلي حاجة. اطمّن نفسك الأول وبعدين كلمني.","note":"⚠ لا إذن مسبق ولا إثبات. الانسحاب حق."},"MSG-K-004":{"id":"MSG-K-004","situation":"حادث","written":"اطمّنّا عليك — إنت كويس؟","spoken":"إنت كويس؟ محتاج إسعاف؟ … متفكرش في الطلب ولا في الفلوس دلوقتي خالص. مش هتتحمّل قيمة الطلب. قولي إنت فين وأنا جاي.","note":"⚠ الصحة أولًا. ولا يُسأل عن الطلب قبل الاطمئنان."},"MSG-K-005":{"id":"MSG-K-005","situation":"التاجر يرفض التسليم","written":"ابعتلنا الوضع ومتدخلش في نقاش.","spoken":"متدخلش في أي نقاش معاهم. المشكلة بينا وبين التاجر مش بينك وبينه، وأنا بحلها دلوقتي. الرحلة دي مش غلطك وهتتسجّل.","note":""},"MSG-K-006":{"id":"MSG-K-006","situation":"فرق في تسوية اليوم","written":"فيه فرق {{AMOUNT}} في تسوية النهارده. محتاجين نراجعه سوا.","spoken":"فيه فرق في حساب النهارده — وأنا بقول فرق مش عجز، لأننا لسه معرفناش سببه. مش هيتخصم منك حاجة دلوقتي. تفتكر ممكن يكون حصل إيه؟","note":"⚠ لغة محايدة إلزامية. ولا خصم أثناء الفحص."},"MSG-K-007":{"id":"MSG-K-007","situation":"ورقة مشتبه في تزييفها","written":"لقينا ورقة محتاجة مراجعة في تسوية {{DATE}}.","spoken":"فيه ورقة محتاجة مراجعة. ده بيحصل وبينتقل بين الناس عادي، ومحدش بيتهم حد. مش هتتحمّلها.","note":"⚠ الاتهام بالتزييف اتهام جنائي. لا يُوجَّه بلا سند."},"MSG-K-008":{"id":"MSG-K-008","situation":"اعتراض على الأرباح","written":"بعتنالك تفصيل حساب كل طلب على حدة.","spoken":"أنا باعتلك التفصيل كامل: كل طلب وحصتك فيه والبقشيش. البقشيش بيوصلك كامل وإحنا مبناخدش منه حاجة. راجعه ولو لقيت أي حاجة غلط قولي.","note":"الشفافية قبل القبول التزام تعاقدي لا تفضّل."},"MSG-K-009":{"id":"MSG-K-009","situation":"إخطار باتهام","written":"وصلنا بلاغ بخصوص طلب {{ORDER_ID}} ومحتاجين نسمع منك.","spoken":"وصلنا بلاغ وأنا بقولك عليه عشان تسمع منك الأول. مفيش قرار اتاخد ومفيش حاجة اتخصمت. احكيلي اللي حصل من وجهة نظرك.","note":"⚠ الإخطار وحق الرد قبل أي قرار."},"MSG-K-010":{"id":"MSG-K-010","situation":"تقييد مؤقت","written":"اتوقف الإسناد ليك مؤقتًا لمدة {{DURATION}}. السبب {{BASIS}}.","spoken":"الإيقاف مؤقت ومدته {{DURATION}}. السبب {{BASIS}}، واللي محتاجينه لرفعه هو {{CONDITION}}. ومن حقك تعترض وهيراجعه حد تاني غيري.","note":"⚠ الأساس والمدة وشرط الرفع ومسار التظلّم — كلها إلزامية."},"MSG-K-011":{"id":"MSG-K-011","situation":"تصحيح بعد ثبوت الخطأ","written":"راجعنا الموضوع وطلع الخطأ مننا. شِلنا كل أثر ليه.","spoken":"أنا آسف. الخطأ كان مننا إحنا، وشِلت كل أثر للموضوع ده من حسابك. ولو كان أثّر على دخلك في أي حاجة قولي وهصلّحها.","note":"⚠ الاعتذار صريح. والتصحيح كامل لا جزئي."},"MSG-K-012":{"id":"MSG-K-012","situation":"شكوى سلوك — فصل وقائي","written":"وقّفنا الإسناد بينك وبين {{CUSTOMER_REF}} لحد ما نراجع.","spoken":"وصلتنا شكوى وأنا وقّفت الإسناد بينك وبينه — ده إجراء حماية للطرفين مش حكم عليك. محتاج أسمع منك، ومفيش قرار اتاخد.","note":"⚠ التمييز بين إجراء الحماية وإجراء العقوبة يُقال صراحةً."}},"par":{"PAR-0023":{"id":"PAR-0023","title":"قيمة رسوم الخدمة (جنيه مصري)","status":"قيمة قائمة في النظام — غير معتمدة — القيمة الجارية صفر — القيمة الافتراضية في محرك التسعير"},"PAR-0004":{"id":"PAR-0004","title":"حد صلاحية اعتماد الاسترداد (جنيه مصري)","status":"غير محدد — يلزم قرار"},"PAR-0001":{"id":"PAR-0001","title":"عدد محاولات الاتصال عند الباب (عدد)","status":"غير محدد — يلزم قرار"},"PAR-0002":{"id":"PAR-0002","title":"مدة انتظار الكابتن عند الباب (دقيقة)","status":"غير محدد — يلزم قرار"},"PAR-0025":{"id":"PAR-0025","title":"نافذة النزاع بعد التسليم (ساعة)","status":"قيمة قائمة في النظام — غير معتمدة — القيمة الجارية 24"},"PAR-0005":{"id":"PAR-0005","title":"حد صلاحية منح ائتمان حسن النية (جنيه مصري)","status":"غير محدد — يلزم قرار"},"PAR-0016":{"id":"PAR-0016","title":"مدة تقييد الدفع عند الاستلام (يوم)","status":"غير محدد — يلزم قرار"},"PAR-0018":{"id":"PAR-0018","title":"نافذة التظلّم (يوم)","status":"غير محدد — يلزم قرار"},"PAR-0014":{"id":"PAR-0014","title":"مستهدف أول استجابة للشكوى (ساعة)","status":"غير محدد — تلزم بيانات"},"PAR-0006":{"id":"PAR-0006","title":"مهلة تسوية التاجر (ساعة)","status":"قيمة قائمة في النظام — غير معتمدة — القيمة الجارية 48"},"PAR-0007":{"id":"PAR-0007","title":"نسبة غرامة تأخر التسوية يوميًا (نسبة مئوية)","status":"قيمة قائمة في النظام — غير معتمدة — القيمة الجارية 0.5"},"PAR-0008":{"id":"PAR-0008","title":"أيام السماح قبل الغرامة (يوم)","status":"قيمة قائمة في النظام — غير معتمدة — القيمة الجارية 3"},"PAR-0009":{"id":"PAR-0009","title":"الحد الأقصى لغرامة التسوية (نسبة مئوية)","status":"قيمة قائمة في النظام — غير معتمدة — القيمة الجارية 5.0"},"PAR-0011":{"id":"PAR-0011","title":"عتبة نسبة القبول في اتفاقية الكابتن (نسبة مئوية)","status":"قيمة قائمة في النظام — غير معتمدة — القيمة الجارية 80"},"PAR-0012":{"id":"PAR-0012","title":"الحد الأدنى للضمان الشهري للكابتن (جنيه مصري)","status":"قيمة قائمة في النظام — غير معتمدة — القيمة الجارية 5000"},"PAR-0021":{"id":"PAR-0021","title":"حد إعدام فرق النقد (جنيه مصري)","status":"غير محدد — يلزم قرار"},"PAR-0013":{"id":"PAR-0013","title":"حد العهدة النقدية اليومية للكابتن (جنيه مصري)","status":"قيمة قائمة في النظام — غير معتمدة — القيمة الجارية 1500"},"PAR-0019":{"id":"PAR-0019","title":"فترة تنسيق الطلب متعدد المتاجر (دقيقة)","status":"غير محدد — تلزم بيانات"},"PAR-0020":{"id":"PAR-0020","title":"أفق حجز الطلب المجدول (يوم)","status":"غير محدد — يلزم قرار"},"PAR-0010":{"id":"PAR-0010","title":"حصة الكابتن من رسوم التوصيل (نسبة مئوية)","status":"قيمة قائمة في النظام — غير معتمدة — القيمة الجارية 70"},"PAR-0003":{"id":"PAR-0003","title":"تعويض الكابتن عن رحلة فاشلة (جنيه مصري)","status":"غير محدد — يلزم قرار — القيمة الجارية 0.00"},"PAR-0024":{"id":"PAR-0024","title":"صلاحية قسيمة النقد (يوم)","status":"غير محدد — تلزم بيانات"},"PAR-0015":{"id":"PAR-0015","title":"ساعات تغطية الدعم (نص)","status":"غير محدد — تلزم بيانات"},"PAR-0017":{"id":"PAR-0017","title":"مدة الاحتفاظ بالأدلة (يوم)","status":"غير محدد — تلزم بيانات"},"PAR-0022":{"id":"PAR-0022","title":"الدورية الافتراضية لمراجعة السياسات (شهر)","status":"غير محدد — يلزم قرار"}},"val":{"VAL-0001":{"id":"VAL-0001","q":"هل ينطبق حق الرجوع بلا سبب خلال أربعة عشر يومًا، وحق العيب خلال ثلاثين يومًا، في قانون حماية المستهلك رقم 181 لسنة 2018، على الطعام المحضَّر وعلى غيره من السلع التي توصّلها منصّة مثل وصّلي؟ والمادة 21 لا تحمل قائمة استثناءات في نصها.","who":"محامٍ مصري"},"VAL-0003":{"id":"VAL-0003","q":"هل يُعدّ الوقت التقديري للتسليم المعروض في التطبيق موعدًا متفقًا عليه لأغراض حق الرجوع عند التأخير؟ وهل يتغير الجواب إذا عُرضت نافذة زمنية بدل وقت واحد؟","who":"محامٍ مصري"},"VAL-0004":{"id":"VAL-0004","q":"يحوّل نظام وصّلي الاسترداد في طلب مدفوع عند الاستلام إلى قسيمة رصيد على المنصّة افتراضيًا. والقانون يوجب الرد بنفس وسيلة الدفع ما لم يُتفق على غيرها. فهل هذا السلوك مخالف؟","who":"محامٍ مصري"},"VAL-0002":{"id":"VAL-0002","q":"تشترط المادتان 17 و21 أن يكون العلاج دون تكلفة إضافية على المستهلك. فهل يجوز لوصّلي تحصيل رسوم توصيل لاستلام صنف معيب أو لإعادة تسليم بديل؟","who":"محامٍ مصري"},"VAL-0008":{"id":"VAL-0008","q":"هل يُعدّ رصيد عميل مغلق غير قابل للسحب — قسيمة النقد القائمة، وأي ائتمان فكّة، وأي ائتمان حسن نية أو ترويجي — إصدارًا لأداة دفع تخضع لتنظيم البنك المركزي؟","who":"متخصص مدفوعات / البنك المركزي"},"VAL-0005":{"id":"VAL-0005","q":"توجب المادة 19 إخطار جهاز حماية المستهلك خلال سبعة أيام من اكتشاف عيب في منتج، وفورًا مع تحذير علني إذا مسّ العيب صحة المستهلك أو سلامته. فما الذي يسري على وصّلي بوصفها منصّة؟","who":"محامٍ مصري"},"VAL-0012":{"id":"VAL-0012","q":"لكل حدث مالي في هذه الحزمة — النقد المحصَّل لدى الكابتن، ومستحق التاجر، وعمولة المنصّة، ورسوم الخدمة، وأرباح الكابتن، والاسترداد، وائتمان حسن النية، والقسيمة غير المستخدمة — ما المعالجة المحاسبية الصحيحة؟ وهل تعمل وصّلي أصيلًا أم وكيلًا؟","who":"محاسب أو مراجع"},"VAL-0006":{"id":"VAL-0006","q":"تأكيد النص الحرفي للمادة 96 من قانون العمل رقم 14 لسنة 2025 مقابل نص الجريدة الرسمية، وبيان هل يغطي باب أنماط العمل الجديدة العمل عبر المنصّات الرقمية صراحةً.","who":"محامٍ مصري"},"VAL-0007":{"id":"VAL-0007","q":"بالنظر إلى معيار المادة 96 — التوجيه أو الإشراف مقابل أجر — هل تجعل المادة 6-2 من اتفاقية الكابتن (ضمان شهري مشروط بثماني ساعات يوميًا، وستة أيام أسبوعيًا، ونسبة قبول لا تقل عن 80%) العلاقةَ علاقةَ عمل؟","who":"محامٍ مصري"},"VAL-0011":{"id":"VAL-0011","q":"على أي أساس قانوني — إن وُجد — يجوز لوصّلي حجز أو خصم مبلغ من أرباح كابتن: لفرق نقدي، أو لصنف يُدّعى فقده أو تلفه، أو لتسليم محل نزاع؟ وهل يختلف الجواب باختلاف تصنيف العلاقة؟","who":"محامٍ مصري"},"VAL-0009":{"id":"VAL-0009","q":"هل سوق التوصيل منشأة يسري عليها قرار رئيس الوزراء رقم 982 لسنة 2026 بشأن العمل عن بُعد؟ فالمادة 2 تشمل الوظائف الإدارية في كل القطاعات بينما المادة 3 تستثني وظائف الخدمات والتشغيل.","who":"محامٍ مصري"},"VAL-0013":{"id":"VAL-0013","q":"ما التزامات التأمين الاجتماعي على موظفي وصّلي في النظام الحالي؟ وما الذي يترتب على الكباتن في كل نتيجة تصنيف محتملة؟","who":"تأمينات اجتماعية"},"VAL-0015":{"id":"VAL-0015","q":"ما التزامات السلامة والصحة المهنية على وصّلي تجاه موظفيها، وما الواجبات الناشئة تجاه كباتن يقودون على طرق عامة بتوجيه من المنصّة، في كل تصنيف محتمل؟","who":"سلامة مهنية"},"VAL-0014":{"id":"VAL-0014","q":"ما التزامات حماية البيانات المنطبقة على معالجة وصّلي لبيانات العملاء والمستلمين والكباتن والتجار والموظفين، بما فيها آثار الموقع وصور التسليم ووثائق الهوية؟","who":"محامٍ مصري"},"VAL-0010":{"id":"VAL-0010","q":"وفق المتطلبات المصرية الحالية، هل يجوز لصيدلية مرخَّصة صرف الدواء وتوصيله عبر سوق إلكتروني تابع لطرف ثالث؟ وما الإشراف الصيدلي والتحقق من الروشتة والتحقق من الهوية المطلوب؟","who":"صيدلي مرخَّص"}}};
const PREV={"DECISIONS":[{"n":1,"code":"FDR-0004","title":"شرط نسبة القبول في اتفاقية الكابتن","urg":"now","rev":"الرجوع عنه مكلف","problem":"الاتفاقية الموقّعة فيها ضمان شهري 5,000 جنيه بشرط 8 ساعات يوميًا و6 أيام أسبوعيًا ونسبة قبول 80%. الشروط دي شكل «موظف» — وممكن تخلي العلاقة «علاقة عمل». والشرط «ملزم تعاقديًا وغير قابل للقياس تقنيًا» (CFL-0005).","why":"«شرط قائم في اتفاقية موقَّعة، ويمسّ تصنيف العلاقة نفسه». والنافذة لحلّه بأقل كلفة «تُغلق فور بناء آلية القياس».","opts":[{"k":"أ","name":"حذف الشرط الآن","pros":"يشيل الخطر من جذره","cons":"الضمان المرتبط بيه يتأثر","cost":"محامي + إعادة توقيع","risk":"قليل","c":"مفيش فرق","m":"مفيش فرق","k2":"حرية أكتر","w":"خطر قانوني أقل"},{"k":"ب","name":"إبقاؤه + بناء تتبع القبول","pros":"تحكم في توفر الكباتن","cons":"يقوّي «علاقة العمل» ويبني اللي الملف بيمنعه","cost":"برمجة + محامي","risk":"عالي جدًا","c":"مفيش فرق","m":"مفيش فرق","k2":"ضغط ورقابة","w":"تعرض كبير"},{"k":"ج","name":"يفضل ساكن","pros":"صفر مجهود","cons":"بند متناقض موقّع يفضل موجود","cost":"صفر الآن","risk":"عالي","c":"مفيش فرق","m":"مفيش فرق","k2":"غموض","w":"قنبلة موقوتة"},{"k":"د","name":"استبداله بتوقع توفر غير مالي","pros":"تخطيط للتوفر من غير ربط بالفلوس","cons":"الكابتن ممكن ما يلتزمش","cost":"محامي + إعادة توقيع","risk":"قليل لمتوسط","c":"مفيش فرق","m":"مفيش فرق","k2":"حرية مع توقعات واضحة","w":"خطر أقل + تخطيط"}],"rec":"أ أو د — الآن، قبل بناء أي تتبّع للقبول","conf":"مرتفعة","mine":"د (أو أ) الأسبوع ده. ولحد تعديل العقد: ولا قياس ولا محاسبة على القبول.","ifnot":"أي كابتن يختلف معاك بعد شهور ممكن يستخدم الاتفاقية نفسها كدليل إنه «عامل».","pol":["CAPTAIN_001","CAPTAIN_003","CAPTAIN_009","CAPTAIN_010","LEGAL_002"],"needs":"تعديل تعاقدي + مراجعة قانونية لأثره على التصنيف (VAL-0006، VAL-0007)"},{"n":2,"code":"FDR-0001","title":"مصير الطلب والبضاعة والفلوس عند فشل التسليم","urg":"pilot","rev":"الرجوع عنه مكلف","problem":"«ماذا يحدث بالضبط للطلب، وللبضاعة، وللمال، حين يرفض عميل الدفع عند الاستلام أو يتعذّر تسليمه عند الباب؟» — «لا توجد حالة لذلك في النظام، ولا قاعدة في أي مكان».","why":"أكتر موقف هيتكرر في بلد أغلبه كاش. ومن غيره «أكثر من نصف الحالات» في الملف محجوبة.","opts":[{"k":"أ","name":"البضاعة ترجع للتاجر ووصلي تتحمل التوصيل","pros":"بسيط","cons":"الأكل الجاهز ما ينفعش يرجع","cost":"متوسطة","risk":"متوسط","c":"مفيش مطالبة","m":"يخسر الأكل الجاهز","k2":"—","w":"خسارة التوصيل"},{"k":"ب","name":"وصلي تشتري البضاعة وتتحمل الخسارة كلها","pros":"التاجر مطمّن تمامًا","cons":"أغلى حل","cost":"عالية","risk":"مالي عالي","c":"مفيش مطالبة","m":"ممتاز","k2":"—","w":"خسارة كاملة"},{"k":"ج","name":"حسب الفئة بجدول متفق عليه مع كل تاجر","pros":"عادل ومرن","cons":"محتاج جدول لكل تاجر","cost":"متوسطة","risk":"قليل","c":"مفيش مطالبة","m":"واضح ومتفق عليه","k2":"—","w":"خسارة محسوبة"},{"k":"د","name":"إلغاء بواسطة العمليات (الوضع الحالي)","pros":"صفر مجهود","cons":"العمولة والتسوية والتقارير تتلخبط","cost":"مخفية وكبيرة","risk":"عالي","c":"غموض","m":"ما يعرفش هيتعوض ولا لأ","k2":"ما يعرفش يعمل إيه بالأكل","w":"فوضى"}],"rec":"ج — يُحسم لكل فئة قبل أول طلب، بجدول يتفق عليه مع كل تاجر. «وصراحةً ليس الخيار د»","conf":"متوسطة","mine":"ج — ومع «الأكل الجاهز بس» في التجربة: وصلي تدفع للمطعم تكلفة الأكل المتفق عليها إلا لو الفشل سببه تأخير جسيم من المطعم. (مثال توضيحي: ≈ 5 جنيه للطلب في المتوسط لو الفشل 3%.)","ifnot":"أول أوردر يترفض: المطعم يطالب، والكابتن متلخبط، والعمليات «تلغي» — والأرقام كلها تتلخبط.","pol":["CUSTOMER_003","OPS_002","MERCHANT_007","FIN_007","CAPTAIN_005"],"needs":"حالة «فشل تسليم» في النظام + سجل مصير بضاعة + جدول فئات مع التجار"},{"n":3,"code":"FDR-0002","title":"تعويض الكابتن عن رحلة انتهت بفشل تسليم","urg":"pilot","rev":"الرجوع عنه مكلف","problem":"الكابتن بيستحق «عند التسليم بس». لو راح وما لقاش حد، ما بياخدش ولا جنيه — رغم إنه صرف بنزين ووقت (CFL-0008).","why":"«يمسّ دخل طرف، ويغيّر سلوكه عند الباب». الكابتن اللي ما بياخدش حاجة لو فشل هيضغط على العميل.","opts":[{"k":"أ","name":"ولا حاجة (زي النهارده)","pros":"صفر تكلفة","cons":"ضغط على العملاء وكباتن تمشي","cost":"صفر","risk":"عالي","c":"ضغط محتمل","m":"—", ة قانونيًا","cost":"عالية جدًا","risk":"عالي جدًا","c":"أكتر — بخطر","m":"+ صيدليات","k2":"مسؤولية دوا","w":"خطر قانوني"}],"rec":"أ للتجربة. ولا تُضاف ب إلا بعد تطبيق قاعدة المصير على طلبات حقيقية. ولا صيدلة قبل اتضاح الوضع القانوني","conf":"مرتفعة","mine":"أ — والبقالة بعد ما قاعدة المصير تشتغل على أكل حقيقي لفترة كافية.","ifnot":"مطعم وسوبر ماركت وحلواني وورد من أول يوم — وكل واحد ليه مشكلة رفض مختلفة ومفيش ولا قاعدة.","pol":["CUSTOMER_003","OPS_002","MERCHANT_001"],"needs":"قاعدة مصير لكل صنف + جدول فئات مع التجار"},{"n":5,"code":"FDR-0005","title":"فرق النقد في المطابقة اليومية","urg":"pilot","rev":"الرجوع عنه مكلف","problem":"«ماذا يحدث لفرق نقدي غير صفري عند المطابقة اليومية، وبأي سند يجوز حجز أي مبلغ عن كابتن؟» — مثال: متوقع 1,300 ولقينا 1,270.","why":"«يمسّ مال شخص بغير حكم، وقد يُنشئ ذمّة لا سند لها».","opts":[{"k":"أ","name":"يتسجل ويتعدم في حد معتمد، ونراجع النمط","pros":"عادل وبيكشف الأنماط","cons":"وصلي بتتحمل الفروق الصغيرة","cost":"صغيرة (حسب الحد)","risk":"قليل","c":"—","m":"—","k2":"عدل","w":"ثقة الكباتن"},{"k":"ب","name":"يتحجز من فلوس الكابتن لحد ما نعرف السبب","pros":"بيحمي وصلي مؤقتًا","cons":"حجز فلوس من غير حكم","cost":"صفر","risk":"عالي (المقاصة سؤال مفتوح)","c":"—","m":"—","k2":"ظلم محتمل","w":"خطر قانوني"},{"k":"ج","name":"يتخصم من الكابتن مباشرةً","pros":"بسيط","cons":"اتهام من غير دليل","cost":"صفر","risk":"عالي جدًا","c":"—","m":"—","k2":"ظلم محتمل","w":"خطر قانوني وكباتن تمشي"}],"rec":"أ — بحد إعدام (PAR-0021)، وبقاعدة صريحة إن «الفرق وحده لا يُثبت سرقة ولا دينًا ولا حقًّا في المقاصّة»","conf":"مرتفعة","mine":"أ بحد إعدام صغير للواقعة (سيناريو للنقاش ≈ 50 جنيه — مش رقم معتمد) + مراجعة شهرية للنمط + اللي عدّ الفلوس ما يقررش الإعدام.","ifnot":"كل آخر يوم خناقة على 20 و30 جنيه، والكابتن الكويس يسيب الشغل لأنه حاسس إنه متهم.","pol":["FIN_001","FIN_006","CAPTAIN_006","RISK_001","GOV_005"],"needs":"رأي المحامي في جواز المقاصة أصلًا (VAL-0011)"},{"n":6,"code":"FDR-0010","title":"رصيد للعميل قبل حسم «النقود الإلكترونية»","urg":"pilot","rev":"يس /* ==========================================================================
   map.js — an illustrative town plan (NOT a real map of Samalout: no real
   street names, no claimed geography). Road graph + Dijkstra routing, a
   cached static base layer and a dynamic layer for routes and markers.
   Scale: 1 map unit ≈ 2.6 m. Motorbike ≈ 22 km/h ≈ 141 units / sim-minute.
   ========================================================================== */
const MAP = (() => {
  const XS = [70, 210, 350, 500, 640, 780, 900];
  const YS = [80, 240, 410, 600, 780, 960, 1140, 1280];
  const W = 1000, H = 1340, M_PER_UNIT = 2.6, SPEED = 141;
  const nodes = {};
  XS.forEach((x, i) => YS.forEach((y, j) => { nodes[`n${i}-${j}`] = { id: `n${i}-${j}`, x, y, i, j }; }));
  const edges = [];
  const cut = new Set(['n0-1|n0-2', 'n1-6|n2-6', 'n5-0|n6-0', 'n6-4|n6-5', 'n2-0|n3-0', 'n0-6|n0-7', 'n4-6|n4-7', 'n6-6|n6-7', 'n1-7|n2-7']);
  const add = (a, b) => { if (!cut.has(`${a}|${b}`) && !cut.has(`${b}|${a}`)) edges.push([a, b]); };
  XS.forEach((x, i) => YS.forEach((y, j) => {
    if (i < XS.length - 1) add(`n${i}-${j}`, `n${i + 1}-${j}`);
    if (j < YS.length - 1) add(`n${i}-${j}`, `n${i}-${j + 1}`);
  }));
  const isMain = (a, b) => (nodes[a].i === 3 && nodes[b].i === 3) || (nodes[a].j === 3 && nodes[b].j === 3);
  const adj = {};
  edges.forEach(([a, b]) => {
    const d = Math.hypot(nodes[a].x - nodes[b].x, nodes[a].y - nodes[b].y);
    (adj[a] = adj[a] || []).push([b, d]); (adj[b] = adj[b] || []).push([a, d]);
  });

  function route(from, to) {
    if (from === to) return [nodes[from]];
    const dist = { [from]: 0 }, prev = {}, seen = new Set();
    const q = [from];
    while (q.length) {
      q.sort((a, b) => dist[a] - dist[b]);
      const u = q.shift();
      if (seen.has(u)) continue; seen.add(u);
      if (u === to) break;
      for (const [v, w] of adj[u] || []) {
        const nd = dist[u] + w;
        if (dist[v] == null || nd < dist[v]) { dist[v] = nd; prev[v] = u; q.push(v); }
      }
    }
    const path = []; let c = to;
    while (c) { path.unshift(nodes[c]); c = prev[c]; }
    return path[0] && path[0].id === from ? path : [nodes[from], nodes[to]];
  }
  const lengthOf = (pts) => pts.reduce((s, p, i) => (i ? s + Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y) : 0), 0);
  function pointAt(pts, d) {
    let acc = 0;
    for (let i = 1; i < pts.length; i++) {
      const seg = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      if (acc + seg >= d) { const t = seg ? (d - acc) / seg : 0; return { x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * t, y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * t, i }; }
      acc += seg;
    }
    const last = pts[pts.length - 1]; return { x: last.x, y: last.y, i: pts.length - 1 };
  }
  function split(pts, d) {
    const p = pointAt(pts, d);
    return [pts.slice(0, p.i).concat([p]), [p].concat(pts.slice(p.i))];
  }
  const km = (units) => (units * M_PER_UNIT) / 1000;
  const minutes = (units) => units / SPEED;

  /* ------------------------------------------------ static base layer */
  const coverage = [[130, 150], [960, 150], [960, 1250], [130, 1250]];
  const inCoverage = (n) => { const p = nodes[n]; return p && p.x >= 130 && p.x <= 960 && p.y >= 150 && p.y <= 1250; };
  const SPECIAL = {
    '0-2': { kind: 'park', ar: 'حديقة', en: 'Park' }, '3-2': { kind: 'market', ar: 'السوق', en: 'Market' }, '1-0': { kind: 'school', ar: 'المدرسة', en: 'School' },

  };
  let baseCache = null;

    if (baseCache && baseCache.lang === LANG) return baseCache.svg;
    let s = `<rect class="m-land" x="-400" y="-400" width="${W + 800}" height="${H + 800}"/>`;

    s += `<text class="m-lbl m-lbl-water" x="985" y="700" transform="rotate(90 985 700)">${L('مجرى مائي — توضيحي', 'Waterway — illustrative')}</text>`;
    const rnd = (() => { let v = 7; return () => ((v = (v * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff); })();
    for (let i = 0; i < XS.length - 1; i++) for (let j = 0; j < YS.length - 1; j++) {
      const x0 = XS[i] + 18, y0 = YS[j] + 18, x1 = XS[i + 1] - 18, y1 = YS[j + 1] - 18;
      const sp = SPECIAL[`${i}-${j}`];

let saveTimer = null;

/* throttled (not debounced): the render loop runs every 250 ms, a debounce would never fire */
function persist() {
  if (saveTimer) return;
  saveTimer = setTimeout(() => { saveTimer = null; Store.save(snapshot()); }, 600);
}
function flushPersist() { clearTimeout(saveTimer); saveTimer = null; Store.save(snapshot()); }
try {
  window.addEventListener('pagehide', flushPersist);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushPersist(); });
} catch (e) { /* non-browser */ }
function restore() {
  const saved = Store.load();
  if (saved && saved.v === SCHEMA) { S = Object.assign(freshState(), saved, { toast: null, busy: {}, dialog: null }); return true; }
  if (saved && saved.set) { S = freshState(saved.set); return false; }
  return false;
}

}

/* ------------------------------------------------------------ notifications, audit, toasts */

}
function toast(text, tone = 'info', icon) { S.toast = { id: uid('t'), text, tone, icon, at: Date.now() }; }

/* ------------------------------------------------------------ pricing */
function cartTotals(cart) {
  const c = cart || S.cust.cart;
  const sub = c.lines.reduce((s, l) => s + unitPrice(l.pid, l.opts) * l.qty, 0);
  const extraSub = (c.extra || []).reduce((s, e) => s + e.lines.reduce((a, l) => a + unitPrice(l.pid, l.opts) * l.qty, 0), 0);
  const mids = [c.mid].concat((c.extra || []).map((e) => e.mid)).filter(Boolean);
  const del = mids.reduce((s, id) => s + (M(id).fee || 0), 0);
  const svc = ECON.serviceFee;
  let disc = 0;
  if ((c.promo || '').toUpperCase() === 'WASALY10') disc = Math.min(30, Math.round((sub + extraSub) * 0.1));
  return { sub: sub + extraSub, del, svc, disc, total: sub + extraSub + del + svc - disc, mids };
}

/* ------------------------------------------------------------ order creation */
function makeOrder(p) {
  const id = 'WS-' + (++S.seq);
  const lines = p.lines.map((l) => ({ pid: l.pid, qty: l.qty, opts: l.opts || {}, note: l.note || '', unit: unitPrice(l.pid, l.opts || {}), state: 'ok' }));
  const sub = lines.reduce((s, l) => s + l.unit * l.qty, 0);
  const m = M(p.mid);
  const del = p.del != null ? p.del : m.fee;
  const disc = p.disc || 0;
  const total = sub + del + ECON.serviceFee - disc;
  const rcp = p.rcp || { mode: 'self' };
  const o = {
    id, mid: p.mid, lines, sub, del, svc: ECON.serviceFee, disc, total,
    pay: { method: p.pay || 'cash', state: p.pay === 'card' ? 'authorized_sim' : 'cod_pending', note: p.cashNote || 'exact', payer: rcp.payer || 'buyer', collected: null },
    rcp, addrId: p.addrId || S.cust.addrId, note: p.note || '',
    st: 'placed', stAt: { placed: now() }, placedAt: now(),
    tl: [], pending: [], inc: [], gate: null, tickets: [], calls: [],
    kid: null, offer: null, offers: [], cap: null,
    prep: p.prep || m.prep, eta: null, promise: null,
    code: String(1000 + Math.floor(Math.random() * 9000)),
    refund: null, rating: null, tip: 0,
    scn: p.scn || null, script: p.script || {}, sim: { proposed: false, option: null }, label: null, fate: null, flags: p.flags || {},
  };
  const route = MAP.route(m.node, addrOf(o).node);
  const tripMin = MAP.minutes(MAP.lengthOf(route));
  const lo = Math.round((o.prep + 4 + tripMin) / 5) * 5, hi = lo + 15;
  o.promise = { lo, hi, at: now() };
  S.orders[id] = o;
  tl(o, { st: 'placed', actor: 'customer', note: L('العميل أكّد الطلب', 'Customer confirmed the order') });
  addPending(o, 'm_accept', 'merchant', 1.2);
  o.timers = { mCall: now() + 3, mTimeout: now() + 5 };
  notify('merchant', { title: L(`طلب جديد ${id}`, `New order ${id}`), body: `${money(o.sub)} · ${lines.length} ${L('أصناف', 'items')}`, icon: 'bell-ring', tone: 'brand', orderId: id });
  notify('customer', { title: L('طلبك اتبعت للمتجر — مستنيين يقبله', 'Order sent — waiting for the store'), icon: 'receipt-text', orderId: id, silent: true });
  audit('system', 'order.create', id);
  return o;
}

/* ------------------------------------------------------------ pending actions (who has to act next) */

const hasPending = (o, kind) => o.pending.some((a) => a.kind === kind);

}
function merchantReject(o, reason) {

}
function merchantReady(o) {

}

/* ------------------------------------------------------------ dispatch */

}

  const kid = pref || pool.sort((a, b) => Math.hypot(S.captains[a].x - mNode.x, S.captains[a].y - mNode.y) - Math.hypot(S.captains[b].x - mNode.x, S.captains[b].y - mNode.y))[0];

  if (S.nav.captain.kid === kid) notify('captain', { title: L(`عرض توصيل جديد — ${mName(o.mid)}`, `New delivery offer — ${mName(o.mid)}`), icon: 'bell-ring', tone: 'brand', orderId: o.id });
}

  o.cap = { phase: 'to_merchant', pts, dist: 0, len: MAP.lengthOf(pts), leg: 1 };

/* ------------------------------------------------------------ movement */
function capPos(o) {

  if (o.cap.phase === 'at_merchant') { const n = MAP.nodes[M(o.mid).node]; return { x: n.x, y: n.y }; }
  if (o.cap.phase === 'at_customer' || o.cap.phase === 'waiting_ops') { const n = MAP.nodes[addrOf(o).node]; return { x: n.x, y: n.y }; }
  return MAP.pointAt(o.cap.pts, o.cap.dist);

function moveCaptains(dt) {
  for (const o of Object.values(S.orders)) {

    if (o.cap.stopped) continue;
    if (S.sys.outage && o.cap.phase === 'to_customer') { /* captain keeps riding; the app just can't see it */ }
    o.cap.dist += MAP.SPEED * dt;
    const c = S.captains[o.kid]; const p = MAP.pointAt(o.cap.pts, Math.min(o.cap.dist, o.cap.len));
    if (S.set.gps !== 'unavailable' || !c.lastFix) { c.x = p.x; c.y = p.y; c.lastFix = now(); }

    tl(o, { ev: 'at_merchant', actor: 'captain:' + o.kid, note: L('الكابتن وصل المتجر', 'Captain at the store') });
    notify('merchant', { title: L(`الكابتن ${kName(o.kid)} وصل لطلب ${o.id}`, `${kName(o.kid)} arrived for ${o.id}`), icon: 'bike', orderId: o.id, silent: userRole() !== 'merchant' });
    if (o.st === 'ready') addPending(o, 'k_pickup', 'captain', 0.5);

    const who = o.rcp.mode === 'other' ? L('المستلم', 'the recipient') : L('العميل', 'the customer');
    notify('customer', { title: L(`الكابتن ${kName(o.kid)} وصل — جهّز ${money(dueCash(o))}`, `${kName(o.kid)} is here — have ${money(dueCash(o))} ready`), icon: 'map-pin', tone: 'brand', orderId: o.id });
    addPending(o, 'c_handover', doorRole(o), 1.0);
    if (o.rcp.mode === 'other') notify('recipient', { title: L(`كابتن وصّلي على الباب — طلب باسمك من ${PEOPLE.customer.name}`, 'A Wasaly captain is at your door'), icon: 'bike', orderId: o.id, silent: userRole() !== 'recipient' });

}

  const pts = MAP.route(M(o.mid).node, addrOf(o).node);

/* ------------------------------------------------------------ delivery & cash */

    case 'accepted': return { allowed: true, kind: 'recorded', ar: 'إلغاء كامل، والواقعة بتتسجّل — التكلفة ضئيلة.', en: 'Full cancel; the event is recorded.' };
    case 'preparing': case 'ready': return { allowed: false, kind: 'undecided', ar: 'الإلغاء أثناء التحضير غير محسوم: التاجر بدأ يستهلك مواد وشغل. ولا خيار من التلاتة اتعتمد.', en: 'Cancelling during preparation is undecided.' };
    case 'picked_up': case 'in_transit': case 'reattempt': return { allowed: false, kind: 'failed', ar: 'بعد استلام الكابتن ده مش إلغاء — بيتعامل كتعذّر تسليم.', en: 'After pickup this is not a cancellation — it is handled as failed delivery.' };

    o.pending.forEach((a) => { if (!GATED.has(a.kind) && a.role !== userRole()) cands.push(a.due); });
    Object.values(o.timers || {}).forEach((v) => { if (v) cands.push(v); });
    (o.sched || []).forEach((b) => cands.push(b.at));
    if (o.cap && ['to_merchant', 'to_customer'].includes(o.cap.phase) && !o.cap.stopped) cands.push(now() + (o.cap.len - o.cap.dist) / MAP.SPEED);
  }
  const future = cands.filter((x) => x > now()).sort((a, b) => a - b);
  if (!future.length) return false;
  const target = future[0] + 0.01; const steps = Math.ceil((target - now()) / 0.25);
  for (let i = 0; i < steps; i++) { const dt = Math.min(0.25, target - now()); if (dt <= 0) break; S.clock.t += dt; moveCaptains(dt); timers(); if (typeof SCN_RUNTIME !== 'undefined') SCN_RUNTIME.tick(); }
  autopilot();
  return true;
}

/* ------------------------------------------------------------ ETA for the customer */
function etaInfo(o) {
  if (!o || !isActive(o)) return null;
  const route2 = MAP.route(M(o.mid).node, addrOf(o).node); const trip = MAP.minutes(MAP.lengthOf(route2));
  let rem = 0;
  if (['placed', 'accepted'].includes(o.st)) rem = o.prep + trip + 2 + (o.st === 'placed' ? 1 : 0);
  else if (o.st === 'preparing') rem = Math.max(0, (o.readyAt || now()) - now()) + trip + 1;
  else if (o.st === 'ready') rem = (o.cap && o.cap.phase === 'to_merchant' ? (o.cap.len - o.cap.dist) / MAP.SPEED : 1) + trip + 1;
  else if (['picked_up', 'in_transit', 'reattempt'].includes(o.st)) rem = o.cap && o.cap.phase === 'to_customer' ? (o.cap.len - o.cap.dist) / MAP.SPEED : 0;
  if (o.cap && o.cap.stopped) rem += 12;
  const lo = Math.max(1, Math.round(rem)), hi = lo + (rem > 10 ? 10 : 4);
  return { lo, hi, rem, clock: clockStr(now() + rem), late: !!o.lateFlag, uncertain: S.set.gps !== 'accurate' || (o.cap && o.cap.stopped) };
}

/* ------------------------------------------------------------ money: "where is the money?" */
function moneyOf(o) {
  const commission = Math.round(o.sub * ECON.commissionPct) / 100;
  const share = Math.round(o.del * ECON.captainSharePct) / 100;
  const merchantNet = o.sub - commission;
  const wasalyRev = commission + (o.del - share) + o.svc - o.disc;
  const tripKm = (MAP.lengthOf(MAP.route(M(o.mid).node, addrOf(o).node)) * MAP.M_PER_UNIT) / 1000;
  const r = { commission, share, merchantNet, wasalyRev, tripKm, fuel: +(tripKm * 2 * ECON.fuelPerKm).toFixed(1) };
  const delivered = ['delivered', 'completed'].includes(o.st);
  const failed = o.st === 'failed_delivery' || o.label === 'failed_delivery_tag' || (o.cnd && !delivered && o.st !== 'cancelled');
  r.phase = delivered ? (o.st === 'completed' ? 'completed' : 'delivered') : failed ? 'failed' : o.st === 'cancelled' ? 'cancelled' : 'open';
  r.customerPaid = delivered && o.pay.method === 'cash' ? (o.pay.collected || 0) : (o.pay.method === 'card' && ['authorized_sim', 'captured_sim'].includes(o.pay.state) ? o.total : 0);
  r.captainHolds = delivered && o.pay.method === 'cash' && o.pay.state === 'collected' ? o.pay.collected : 0;
  r.refund = o.refund ? o.refund.amount : 0;
  r.expectedLoss = 0; r.actualLoss = 0; r.undecided = [];
  r.goods = null;
  if (r.phase === 'failed' || (o.st === 'cancelled' && o.cancel && o.cancel.tagged)) {
    r.expectedLoss = r.fuel; // only the trip cost is certain (illustrative fuel figure)
    r.undecided.push('FDR-0001', 'FDR-0002');
    // the food at menu price; its real cost is unknown and who carries it is FDR-0001 — no invented split
    const opt = o.sim && o.sim.option;
    r.goods = { amount: o.sub, bearer: opt === 'أ' ? 'merchant' : opt === 'ب' ? 'wasaly' : opt === 'ج' ? 'table' : null };
  }
  return r;
}

/* ------------------------------------------------------------ runtime */
const SCN_RUNTIME = (() => {
  function start(id) {
    const sc = SCENARIOS[id]; if (!sc) return;
    const keep = { theme: S.set.theme, lang: S.set.lang, device: S.set.device, review: S.set.review, speed: S.set.speed, role: S.set.role, autopilot: S.set.autopilot, panel: S.set.panel };
    S = freshState(keep);
    Object.assign(S.cust, { stage: 'app', loggedIn: true, auth: 'phone', perm: 'granted' });
    S.nav.merchant.loggedIn = true; S.nav.captain.loggedIn = true;
    S.scenario = { id, startedAt: now(), log: [] };
    S.seq = 10427;
    const st = sc.setup;
    if (st.captainChange != null) S.captains[st.captain].change = st.captainChange;
    if (st.rcp) S.cust.rcp = Object.assign({}, S.cust.rcp, st.rcp);
    if (st.noAutoPlace) {
      // the customer has to go through checkout themselves (payment / blocked services)
      S.cust.cart = { mid: st.mid, lines: deepClone(st.lines), note: '', promo: '', extra: deepClone(st.multi || []) };
      S.cust.pay = st.pay || 'cash';
      S.cust.payFail = !!st.payFails; S.cust.payGhost = !!st.chargedNoOrder;
      if (st.scheduled) S.cust.schedule = { day: 'tomorrow', time: '18:00', occasion: 'عيد ميلاد', name: 'سلمى' };
      go('customer', 'cart');
      S.nav.customer.tab = 'home';
      S.set.role = 'customer'; // this scenario starts at the customer's checkout
      toast(L(`سيناريو ${id}: ${sc.title} — كمّل من السلة`, `Scenario ${id}: continue from the cart`), 'info', 'flask-conical');
      return;
    }
    const o = makeOrder({ mid: st.mid, lines: st.lines, pay: st.pay, cashNote: st.cashNote, rcp: st.rcp ? Object.assign({}, st.rcp) : { mode: 'self' }, addrId: st.rcp && st.rcp.addrId ? st.rcp.addrId : 'a1', scn: id,
      script: { captain: st.captain, atDoor: st.atDoor, opsCall: st.opsCall, words: st.words, rejectFirst: st.rejectFirst, merchantLate: st.merchantLate, itemOut: st.itemOut, merchantCloses: st.merchantCloses, captainCancels: st.captainCancels, breakdown: st.breakdown, after: st.after, gpsIssue: st.gpsIssue, offlineMid: st.offlineMid, outageMid: st.outageMid, cashDiff: st.cashDiff } });
    S.active = o.id;
    S.nav.customer.tab = 'orders';
    S.nav.customer.stacks.orders = [{ s: 'orders' }, { s: 'track', id: o.id }];
    toast(L(`بدأ سيناريو ${id}: ${sc.title}`, `Scenario ${id} started`), 'info', 'flask-conical');
  }
  /* scripted beats are stored on the order (persisted), not in closures */
  function sched(o, delay, fn, arg) { (o.sched = o.sched || []).push({ at: now() + delay, fn, arg }); }
  const BEATS = {
    itemOut: (o, pid) => itemOut(o, pid),
    makeLate: (o) => makeLate(o),
    closes: (o) => merchantCloses(o),
    capCancel: (o) => { if (o.cap && o.cap.phase === 'to_merchant') captainCancel(o, L('الموتوسيكل فيه مشكلة', 'Bike problem')); },
    breakdown: (o) => breakdown(o),
    gps: (o, v) => { S.set.gps = v; if (v !== 'accurate') tl(o, { ev: 'gps', actor: 'sim', note: v === 'weak' ? L('إشارة GPS ضعيفة', 'Weak GPS signal') : L('GPS وقف — آخر موقع معروف بس', 'GPS lost — last known location only'), kind: 'warn' }); },
    net: (o, v) => { S.set.network = v; if (v === 'good') toast(L('النت رجع — الطلب اتحدّث', 'Back online — order refreshed'), 'success', 'wifi'); },
    outage: () => outage(true),
    complaint: (o, k) => complaint(o, k),
    cashDiff: (o, a) => cashDiff(o, a),
  };
  function on(o, ev) {
    const sc = o.script || {};
    if (ev === 'st:preparing') {
      if (sc.itemOut) sched(o, 3, 'itemOut', sc.itemOut);
      if (sc.merchantLate) sched(o, 4, 'makeLate');
      if (sc.merchantCloses) sched(o, 5, 'closes');
    }
    if (ev === 'assigned' && sc.captainCancels && !o.didCancel) { o.didCancel = true; sched(o, 1.2, 'capCancel'); }
    if (ev === 'st:in_transit') {
      if (sc.breakdown && !o.didBreak) { o.didBreak = true; sched(o, 2.5, 'breakdown'); }
      if (sc.gpsIssue && !o.didGps) { o.didGps = true; sched(o, 1.5, 'gps', 'weak'); sched(o, 4, 'gps', 'unavailable'); sched(o, 7, 'gps', 'accurate'); }
      if (sc.offlineMid && !o.didOff) { o.didOff = true; sched(o, 1.5, 'net', 'offline'); sched(o, 5, 'net', 'good'); }
      if (sc.outageMid && !o.didOut) { o.didOut = true; sched(o, 1.5, 'outage'); }
    }
    if (ev === 'delivered') {
      if (sc.after) sched(o, 1.2, 'complaint', sc.after);
      if (sc.cashDiff) sched(o, 1.5, 'cashDiff', sc.cashDiff);
    }
  }
  function tick() {
    for (const o of Object.values(S.orders)) {
      if (!o.sched || !o.sched.length) continue;
      const due = o.sched.filter((b) => now() >= b.at);
      if (!due.length) continue;
      o.sched = o.sched.filter((b) => now() < b.at);
      due.forEach((b) => { try { BEATS[b.fn](o, b.arg); } catch (e) { console.error(e); } });
    }
  }

  /* ---- at the door (customer autopilot) */
  function door(o) {
    const mode = o.script.atDoor;
    if (!mode) return customerHandover(o, { given: cashGiven(o) });
    doorEvent(o, mode);
  }
  function doorEvent(o, mode) {
    dropPending(o, 'c_handover');
    o.door = { mode, at: now() };
    if (mode === 'refuse') {
      const words = o.script.words || L('مش عايزه خلاص', 'I do not want it anymore');
      tl(o, { ev: 'refused', actor: 'customer', note: L(`العميل فتح وقال: «${words}»`, `Customer said: “${words}”`), kind: 'warn' });
      addPending(o, 'k_report', 'captain', 0.6, { reason: 'refused', words });
    } else if (mode === 'no_answer') {
      for (let i = 1; i <= 3; i++) callLog(o, 'captain', 'customer', L(`محاولة ${i} — مفيش رد`, `Attempt ${i} — no answer`));
      tl(o, { ev: 'waiting', actor: 'captain:' + o.kid, note: L('الكابتن مستني عند الباب — المدة المطلوبة مش متحددة (PAR-0002)', 'Captain waiting — required wait not defined (PAR-0002)'), kind: 'warn' });
      addPending(o, 'k_report', 'captain', 2.5, { reason: 'no_answer' });
    } else if (mode === 'wrong_address') {
      tl(o, { ev: 'wrong_address', actor: 'captain:' + o.kid, note: L('الكابتن عند الإحداثيات: أرض فاضية', 'Captain at the pin: empty lot'), kind: 'warn' });
      callLog(o, 'captain', 'customer', L('مفيش رد', 'no answer'));
      addPending(o, 'k_report', 'captain', 1.0, { reason: 'wrong_address' });
    } else if (mode === 'recipient_refuse') {
      tl(o, { ev: 'recipient_refused', actor: 'recipient', note: L('المستلمة قالت: «أنا ماطلبتش حاجة ومعرفش الكابتن»', 'Recipient: “I did not order anything”'), kind: 'warn' });
      addPending(o, 'k_report', 'captain', 0.6, { reason: 'recipient_refused' });
    } else if (mode === 'not_home') {
      callLog(o, 'captain', 'customer', L('رد: «أنا برّه، سيبه مع البواب»', 'Answered: “I am out, leave it with the doorman”'));
      tl(o, { ev: 'not_home', actor: 'customer', note: L('العميل برّه وطلب الترك مع البواب — الطلب كاش ولسه ما اتدفعش', 'Customer away, asked to leave it — COD unpaid'), kind: 'warn' });
      addPending(o, 'c_nothome', doorRole(o), 1.5);
    }
    if (typeof requestRender === 'function') requestRender();
  }
  AUTO.k_report = (o, a) => cannotDeliver(o, a.reason, a.words);
  AUTO.c_nothome = (o) => notHomeChoice(o, 'wait');
  function notHomeChoice(o, choice) {
    dropPending(o, 'c_nothome');
