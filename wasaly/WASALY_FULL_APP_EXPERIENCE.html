/* ---------- truth classification (never blurred) ---------- */
const TRUTH_KINDS = {
  current: { ar: 'موجود حاليًا', en: 'Current / verified', icon: 'badge-check' },
  draft: { ar: 'مسودة سياسة', en: 'Policy draft', icon: 'file-text' },
  proposal: { ar: 'اقتراح', en: 'Proposal', icon: 'lightbulb' },
  problem: { ar: 'مشكلة مكتشفة', en: 'Problem found', icon: 'triangle-alert' },
  solution: { ar: 'حل مقترح', en: 'Proposed solution', icon: 'wrench' },
  decision: { ar: 'قرار المؤسس مطلوب', en: 'Founder decision required', icon: 'scale' },
  legal: { ar: 'مراجعة قانونية مطلوبة', en: 'Legal review required', icon: 'landmark' },
  finance: { ar: 'مراجعة مالية مطلوبة', en: 'Financial review required', icon: 'calculator' },
  pilot: { ar: 'يحتاج تجربة فعلية', en: 'Pilot validation required', icon: 'clipboard-check' },
  notbuilt: { ar: 'غير مبني حاليًا', en: 'Not built', icon: 'construction' },
  sim: { ar: 'محاكاة فقط', en: 'Simulation only', icon: 'flask-conical' },
  unknown: { ar: 'غير محسوم', en: 'Unknown', icon: 'circle-help' },
};
const truth = (k, o = {}) => { const t = TRUTH_KINDS[k] || TRUTH_KINDS.unknown; return `<span class="${cls('truth', 'st-' + k, o.cls)}" title="${attr(L(t.ar, t.en))}">${ic(t.icon, o.size || 13)}<span>${o.label || L(t.ar, t.en)}</span></span>`; };

/* ---------- annotation marker: only visible in founder review mode ---------- */
function A(id, o = {}) {
  if (!S.set.review) return '';
  const f = FINDINGS_BY_ID[id]; if (!f) return '';
  CUR.anno.add(id);
  const t = TRUTH_KINDS[f.type] || TRUTH_KINDS.unknown;
  return `<button type="button" class="${cls('anno', 'st-' + f.type, o.cls)}" data-act="anno" data-id="${attr(id)}" aria-label="${attr(`${L(t.ar, t.en)}: ${f.title}`)}">${ic(t.icon, 14)}<span class="anno-k">${f.num}</span><span class="anno-t">${esc(o.short || f.short || f.title)}</span></button>`;
}
/* several markers in a row */
const AA = (...ids) => { const x = ids.map((i) => A(i)).join(''); return x ? `<div class="anno-row">${x}</div>` : ''; };
/* policy reference chip (opens the policy drawer) */
function P(id, o = {}) {
  CUR.pol.add(id);
  if (o.silent) return '';
  return `<button type="button" class="pol-chip" data-act="policy" data-id="${attr(id)}">${ic('scroll-text', 12)}<span>${esc(id)}</span></button>`;
}

/* ---------- per-render context (what the current screen references) ---------- */
const CUR = { pol: new Set(), anno: new Set(), step: null, title: '' };
function resetCur() { CUR.pol = new Set(); CUR.anno = new Set(); CUR.step = null; CUR.title = ''; }

/* ---------- headers ---------- */
function appbar(title, o = {}) {
  const left = o.back ? `<button type="button" class="icon-btn appbar-back" data-act="${o.backAct || 'back'}" aria-label="${attr(L('رجوع', 'Back'))}">${back(22)}</button>` : (o.lead || '');
  return `<header class="${cls('appbar', o.transparent && 'appbar-clear', o.cls)}">${left}<div class="appbar-title">${o.eyebrow ? `<span class="eyebrow">${o.eyebrow}</span>` : ''}<h1>${title}</h1></div><div class="appbar-actions">${o.actions || ''}</div></header>`;
}
const sectionHead = (title, o = {}) => `<div class="sec-head">${o.icon ? ic(o.icon, 18) : ''}<h2>${title}</h2>${o.aside ? `<div class="sec-aside">${o.aside}</div>` : ''}</div>`;

/* ---------- list rows ---------- */
function row(o) {
  const tag = o.act ? 'button' : 'div';
  const data = o.act ? ` type="button" data-act="${o.act}"${Object.entries(o.data || {}).map(([k, v]) => ` data-${k}="${attr(v)}"`).join('')}` : '';
  return `<${tag} class="${cls('row', o.act && 'row-tap', o.cls)}"${data}>${o.icon ? `<span class="row-ic ${o.iconTone ? 'tone-' + o.iconTone : ''}">${ic(o.icon, 20)}</span>` : ''}${o.media || ''}<span class="row-main"><span class="row-title">${o.title}</span>${o.sub ? `<span class="row-sub">${o.sub}</span>` : ''}</span>${o.end ? `<span class="row-end">${o.end}</span>` : ''}${o.act && !o.noChevron ? `<span class="row-chev">${fwd(18)}</span>` : ''}</${tag}>`;
}
const listBox = (rows, o = {}) => `<div class="${cls('list', o.cls)}">${rows.join('')}</div>`;

/* ---------- status pill ---------- */
function stPill(st) {
  const m = STATUS_META[st] || { ar: st, en: st, tone: 'neutral' };
  return `<span class="${cls('pill', 'pill-' + m.tone)}">${m.proposed ? ic('flask-conical', 12) : ''}${L(m.ar, m.en)}</span>`;
}

/* ---------- media ---------- */
const food = (kind, o = {}) => `<span class="${cls('food', o.cls)}" style="${o.bg ? `--food-bg:${o.bg}` : ''}">${IL.food(kind)}</span>`;
const merchantLogo = (m, size = 44) => `<span class="mlogo" style="--m-accent:${m.accent};--m-soft:${m.accentSoft};width:${size}px;height:${size}px">${ic(m.logoIcon || 'store', Math.round(size * 0.5))}</span>`;
const demoTag = () => `<span class="demo-tag" title="${attr(L('بيانات تجريبية', 'Fictional demo data'))}">${ic('flask-conical', 11)}${L('تجريبي', 'Demo')}</span>`;

/* ---------- money line ---------- */
const moneyRow = (label, v, o = {}) => `<div class="${cls('mrow', o.strong && 'mrow-strong', o.cls)}"><span>${label}${o.note ? `<small>${o.note}</small>` : ''}</span><b class="num">${o.raw ? v : money(v, o)}</b></div>`;

/* ---------- empty / skeleton / banner ---------- */
const empty = (illo, title, sub, action) => `<div class="empty">${illo ? `<div class="empty-illo">${illo}</div>` : ''}<h3>${title}</h3>${sub ? `<p>${sub}</p>` : ''}${action || ''}</div>`;
const skel = (n = 3) => `<div class="skel-wrap" aria-busy="true" aria-label="${attr(L('جاري التحميل', 'Loading'))}">${Array.from({ length: n }, () => '<div class="skel skel-card"></div>').join('')}</div>`;
const banner = (tone, icon, text, action) => `<div class="banner banner-${tone}" role="status">${ic(icon, 18)}<div class="banner-t">${text}</div>${action || ''}</div>`;
const note = (text, o = {}) => `<p class="${cls('note', o.cls)}">${o.icon !== false ? ic(o.icon || 'info', 14) : ''}<span>${text}</span></p>`;

/* ---------- stepper (quantity) ---------- */
const stepper = (val, actMinus, actPlus, data = {}, o = {}) => {
  const d = Object.entries(data).map(([k, v]) => ` data-${k}="${attr(v)}"`).join('');
  return `<div class="stepper" role="group" aria-label="${attr(L('الكمية', 'Quantity'))}"><button type="button" class="stp-btn" data-act="${actMinus}"${d} aria-label="${attr(L('قلّل', 'Decrease'))}"${o.minDisabled ? ' disabled' : ''}>${ic(val <= 1 && o.trash ? 'trash-2' : 'minus', 18)}</button><output class="stp-val num" aria-live="polite">${val}</output><button type="button" class="stp-btn" data-act="${actPlus}"${d} aria-label="${attr(L('زوّد', 'Increase'))}"${o.maxDisabled ? ' disabled' : ''}>${ic('plus', 18)}</button></div>`;
};

/* ---------- timeline (the stitched thread) ---------- */
function thread(steps) {
  // steps: [{label, sub, state: done|now|todo|fail|block, icon}]
  return `<ol class="thread">${steps.map((s) => `<li class="th-step th-${s.state}"><span class="th-dot">${ic(s.state === 'done' ? 'check' : s.state === 'fail' ? 'x' : s.state === 'block' ? 'ban' : (s.icon || 'circle'), 14)}</span><div class="th-body"><span class="th-label">${s.label}</span>${s.sub ? `<span class="th-sub">${s.sub}</span>` : ''}${s.extra || ''}</div></li>`).join('')}</ol>`;
}

/* ---------- sheet & dialog containers (rendered by the shell) ---------- */
function sheetWrap(inner, o = {}) {
  return `<div class="sheet-layer" data-key="sheet-${o.key || 'x'}"><button type="button" class="scrim" data-act="${o.closeAct || 'sheet-close'}" aria-label="${attr(L('إغلاق', 'Close'))}" tabindex="-1"></button><section class="${cls('sheet', o.tall && 'sheet-tall', o.cls)}" role="dialog" aria-modal="true" aria-label="${attr(o.label || '')}" tabindex="-1"><div class="sheet-grip" aria-hidden="true"></div>${o.title ? `<div class="sheet-head"><h2>${o.title}</h2><button type="button" class="icon-btn" data-act="${o.closeAct || 'sheet-close'}" aria-label="${attr(L('إغلاق', 'Close'))}">${ic('x', 20)}</button></div>` : ''}<div class="sheet-body">${inner}</div>${o.footer ? `<div class="sheet-foot">${o.footer}</div>` : ''}</section></div>`;
}

/* ---------- form fields ---------- */
function field(o) {
  const id = o.id || uid('f');
  const req = o.req ? `<span class="req" aria-hidden="true">*</span>` : '';
  const input = o.textarea
    ? `<textarea id="${id}" class="input textarea" data-bind="${o.bind}" rows="${o.rows || 3}" ${o.placeholder ? `placeholder="${attr(o.placeholder)}"` : ''} ${o.max ? `maxlength="${o.max}"` : ''}>${esc(o.value || '')}</textarea>`
    : `<input id="${id}" class="input" data-bind="${o.bind}" type="${o.type || 'text'}" value="${attr(o.value || '')}" ${o.placeholder ? `placeholder="${attr(o.placeholder)}"` : ''} ${o.inputmode ? `inputmode="${o.inputmode}"` : ''} ${o.autocomplete ? `autocomplete="${o.autocomplete}"` : 'autocomplete="off"'} ${o.disabled ? 'disabled' : ''} ${o.dir ? `dir="${o.dir}"` : ''}>`;
  return `<div class="${cls('field', o.error && 'has-error')}"><label for="${id}">${o.label}${req}</label>${input}${o.help ? `<p class="help">${o.help}</p>` : ''}${o.error ? `<p class="err" role="alert">${ic('circle-alert', 14)}${o.error}</p>` : ''}</div>`;
}
const radioCard = (name, value, cur, title, sub, o = {}) => `<button type="button" role="radio" aria-checked="${value === cur}" class="${cls('rcard', value === cur && 'on', o.disabled && 'is-disabled', o.cls)}" data-act="${o.act || 'pick'}" data-k="${attr(name)}" data-v="${attr(value)}"${o.disabled ? ' aria-disabled="true"' : ''}>${o.icon ? `<span class="rcard-ic">${ic(o.icon, 22)}</span>` : ''}<span class="rcard-main"><span class="rcard-title">${title}</span>${sub ? `<span class="rcard-sub">${sub}</span>` : ''}</span>${o.end || ''}<span class="rcard-dot" aria-hidden="true"></span></button>`;

SCR.c_locate = () => {

function progressOf(o) {

function orderMap(o, o2 = {}) {
  const m = M(o.mid); const mn = MAP.nodes[m.node]; const a = addrOf(o); const an = MAP.nodes[a.node];
  const legs = []; let cap = null;
  const mainRoute = MAP.route(m.node, a.node);
  if (o.cap && o.cap.phase === 'to_merchant') { legs.push({ pts: o.cap.pts, done: o.cap.dist / o.cap.len }); legs.push({ pts: mainRoute, done: 0, muted: true }); }
  else if (o.cap && ['to_customer'].includes(o.cap.phase)) { legs.push({ pts: o.cap.pts, done: o.cap.dist / o.cap.len }); }
  else if (o.cap && ['at_customer', 'waiting_ops', 'done'].includes(o.cap.phase)) { legs.push({ pts: o.cap.pts || mainRoute, done: 1 }); }
  else legs.push({ pts: mainRoute, done: 0, muted: true });
  if (o.kid && o.cap && o.cap.phase !== 'done') {
    const c = S.captains[o.kid]; let x = c.x, y = c.y; const gps = S.set.gps;
    if (gps === 'weak') { const j = (Math.sin(now() * 13) + Math.cos(now() * 7)) * 14; x += j; y -= j * 0.7; }
    cap = { x, y, gps, stale: gps === 'unavailable', label: '' };
  }
  const fit = mainRoute.concat(o.cap && o.cap.pts ? o.cap.pts : []);
  return MAP.render({ legs, markers: [{ x: mn.x, y: mn.y, kind: 'merchant' }, { x: an.x, y: an.y, kind: 'home' }], captain: cap, fit, zoom: S.cust.mapZoom || 1, aspect: o2.aspect || 1.35, pad: 90 });
}
function custTimeline(o) {
  const ev = (name) => o.tl.find((x) => x.ev === name);
  const at = (st) => o.stAt[st];
  const failed = o.st === 'cancelled' || o.st === 'failed_delivery';
  const steps = [
    { k: 'placed', label: L('الطلب اتبعت', 'Order placed'), t: at('placed') },
    { k: 'accepted', label: L('المتجر قبل', 'Store accepted'), t: at('accepted') },
    { k: 'preparing', label: L('بيتحضّر', 'Preparing'), t: at('preparing') },
    { k: 'assigned', label: o.kid ? L(`الكابتن ${kName(o.kid)} اتعيّن`, `${kName(o.kid)} assigned`) : L('بندوّر على كابتن', 'Finding a captain'), t: ev('assigned') && ev('assigned').t },
    { k: 'picked_up', label: L('الكابتن استلم', 'Picked up'), t: at('picked_up') },
    { k: 'at_customer', label: L('الكابتن وصل', 'Captain arrived'), t: ev('at_customer') && ev('at_customer').t },
    { k: 'delivered', label: L('اتسلّم', 'Delivered'), t: at('delivered') },
  ];
  let seenNow = false;
  return thread(steps.map((s) => {
    let state = s.t != null ? 'done' : 'todo';
    if (state === 'todo' && !seenNow && !failed) { state = 'now'; seenNow = true; }
    if (state === 'todo' && failed && !seenNow) { state = 'fail'; seenNow = true; }
    return { label: s.label, sub: s.t != null ? clockStr(s.t) : '', state };
  }));
}

/* ---------- navigation helpers (shared by every phone role) ---------- */
let NAVDIR = 'none';
function navOf(role) { return S.nav[role]; }
function stackOf(role) { const n = S.nav[role]; return n.stacks[n.tab]; }
function topOf(role) { const st = stackOf(role); return st[st.length - 1]; }
function go(role, s, params = {}) { const st = stackOf(role); st.push(Object.assign({ s }, params)); NAVDIR = 'fwd'; S.sheet = null; }
function goBack(role) { const st = stackOf(role); if (st.length > 1) { st.pop(); NAVDIR = 'back'; } S.sheet = null; }
function setTab(role, tab) { const n = S.nav[role]; if (n.tab === tab) { n.stacks[tab] = n.stacks[tab].slice(0, 1); } n.tab = tab; NAVDIR = 'none'; S.sheet = null; }
function openSheet(sh) { S.sheet = sh; }
function closeSheet() { S.sheet = null; }

/* ---------- network simulation for user-initiated server calls ---------- */
function net(key, fn, o = {}) {
  if (S.busy[key]) return; // a request with this key is already in flight — ignore double taps
  const n = S.set.network;
  if (S.sys.outage && !o.ops) { toast(L('فيه عطل عندنا دلوقتي — مش قادرين نكمّل. جرّب كمان شوية.', 'We have an outage — try again shortly.'), 'danger', 'server-crash'); requestRender(); return; }
  if (n === 'offline') { toast(L('مفيش إنترنت. اتأكد من الاتصال وجرّب تاني.', 'You are offline. Check your connection.'), 'danger', 'wifi-off'); requestRender(); return; }
  const delay = { good: 380, slow: 2300, timeout: 3200, error: 900 }[n] || 380;
  S.busy[key] = true; requestRender();
  setTimeout(() => {
    S.busy[key] = false;
    if (n === 'timeout') {
      if (o.onTimeout) o.onTimeout();
      else S.dialog = { title: L('الطلب ما وصلش للسيرفر', 'Request timed out'), body: L('الاتصال بطيء قوي. جرّب تاني.', 'The connection is very slow. Try again.'), confirm: { label: L('جرّب تاني', 'Retry'), act: 'dialog-retry' }, retry: () => net(key, fn, o) };
    } else if (n === 'error') {
      S.dialog = { title: L('حصلت مشكلة عندنا', 'Something went wrong on our side'), body: L('مش ذنبك. جرّب تاني كمان شوية — ولو اتكررت كلّم الدعم.', 'Not your fault. Try again shortly.'), confirm: { label: L('جرّب تاني', 'Retry'), act: 'dialog-retry' }, retry: () => net(key, fn, o), tone: 'danger' };
    } else fn();
    requestRender();
  }, delay);
}

      return;
    }

    const t = cartTotals(c);
    const o = makeOrder({ mid: c.mid, lines: c.lines, pay: S.cust.pay, cashNote: S.cust.cashNote, rcp: S.cust.rcp.mode === 'other' ? deepClone(S.cust.rcp) : { mode: 'self' }, addrId: S.cust.rcp.mode === 'other' ? S.cust.rcp.addrId : S.cust.addrId, disc: t.disc, note: c.note, script: { captain: 'k1' } });
    if (multi) { o.sim.proposed = true; o.multi = multi.map((e) => { const sub = makeOrder({ mid: e.mid, lines: e.lines, pay: S.cust.pay, cashNote: 'exact', rcp: o.rcp, addrId: o.addrId, script: {} }); sub.parent = o.id; return sub.id; }); tl(o, { ev: 'multi', actor: 'sim', note: L('محاكاة: طلب متعدد المتاجر — كل متجر طلب فرعي بحالته', 'Simulation: multi-store — each store is a sub-order'), kind: 'sim' }); }

    S.active = o.id; S.cust.cart = { mid: null, lines: [], note: '', promo: '', extra: [] }; S.cust.schedule = null;
    const st = stackOf('customer'); st.splice(1); st.push({ s: 'confirm', id: o.id }); NAVDIR = 'fwd';
    setTimeout(() => { const top = topOf('customer'); if (top.s === 'confirm' && top.id === o.id) { top.s = 'track'; NAVDIR = 'fwd'; requestRender(); } }, 2600);
  };

function flyToCart(srcEl) {
  if (prefersReduced() || !srcEl) return;
  const target = document.querySelector('.cartbar, .tab[data-tab="home"]'); if (!target) return;
  const a = srcEl.getBoundingClientRect(), b = target.getBoundingClientRect();
  const dot = document.createElement('div'); dot.className = 'fly-dot'; document.body.appendChild(dot);
  dot.style.left = a.left + a.width / 2 + 'px'; dot.style.top = a.top + 'px';
  const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top - a.top;
  dot.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${dx / 2}px, ${dy / 2 - 60}px) scale(.8)`, opacity: 0.9 }, { transform: `translate(${dx}px, ${dy}px) scale(.3)`, opacity: 0 }], { duration: 460, easing: 'cubic-bezier(.4,0,.2,1)' }).onfinish = () => dot.remove();
}
function focusFirstError() { setTimeout(() => { const el = document.querySelector('.has-error input, .has-error textarea, .has-error select, .has-error .opt, .field .err'); if (el) { const f = el.closest('.field, .ogroup'); (f && f.querySelector('input, textarea, select, button') || el).focus(); } }, 30); }
const prefersReduced = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

  const done = list.filter((o) => !incoming.includes(o) && !working.includes(o));
  const delivered = list.filter((o) => ['delivered', 'completed'].includes(o.st));

function capMap(o, phaseOverride) {
  const c = myCap(); const legs = []; const markers = [];
  if (o) {
    const mn = MAP.nodes[M(o.mid).node]; const an = MAP.nodes[addrOf(o).node];
    markers.push({ x: mn.x, y: mn.y, kind: 'merchant' });
    if (o.cap && ['to_customer', 'at_customer', 'waiting_ops'].includes(o.cap.phase) || phaseOverride === 'offer') markers.push({ x: an.x, y: an.y, kind: 'home' });
    if (o.cap && o.cap.pts) legs.push({ pts: o.cap.pts, done: o.cap.dist / o.cap.len });
    else if (phaseOverride === 'offer') { legs.push({ pts: MAP.route(nearestNode(c.x, c.y), M(o.mid).node), done: 0 }); legs.push({ pts: MAP.route(M(o.mid).node, addrOf(o).node), done: 0, muted: true }); }
  } else Object.values(MERCHANTS).filter((m) => !m.blocked).forEach((m) => { const n = MAP.nodes[m.node]; markers.push({ x: n.x, y: n.y, kind: 'merchant' }); });
  const fit = o ? legs.flatMap((l) => l.pts).concat(markers) : [{ x: c.x - 250, y: c.y - 250 }, { x: c.x + 250, y: c.y + 250 }];
  let x = c.x, y = c.y; if (S.set.gps === 'weak') { const j = Math.sin(now() * 11) * 14; x += j; y += j * 0.6; }
  return MAP.render({ legs, markers, captain: { x, y, gps: S.set.gps, stale: S.set.gps === 'unavailable' }, fit, zoom: S.nav.captain.zoom || 1, aspect: 1.2, pad: 90 });
}

function recipientSheet() { return ''; }

onAct('r-getcode', (d) => {
  const o = ord(d.id); if (!o) return;
  o.rcpCode = true;
  tl(o, { ev: 'rcp_code', actor: 'recipient', note: L('المستلمة كلّمت المشتري وخدت الكود منه — مفيش رسالة وصلتها', 'Recipient called the buyer for the code — no message reached her') });
  toast(L(`${PEOPLE.customer.name} في التليفون: «الكود ${o.code}»`, `${PEOPLE.customer.nameEn} on the phone: “the code is ${o.code}”`), 'info', 'phone-call');
  requestRender();
});
onAct('r-accept', (d) => {
  const o = ord(d.id); if (!o || !o.rcpCode) return;
  net('handover', () => { customerHandover(o, { given: cashGiven(o) }); toast(L('تمام — الكابتن هيأكد التسليم', 'OK — the captain will confirm'), 'success', 'check'); });
});
onAct('r-refuse', (d) => { const o = ord(d.id); if (!o) return; SCN_RUNTIME.doorEvent(o, 'recipient_refuse'); requestRender(); });

function recommendedFor(t) {

  return MANUAL.inc[map[t.kind]];
}

function journeyStatuses() {
  const o = activeOrder();
  const st = Array(19).fill('waiting');
  if (!o) {
    const c = S.cust; const top = S.cust.stage === 'app' ? topOf('customer').s : null;
    if (c.stage !== 'splash') st[1] = 'completed';
    if (c.stage === 'app' || c.onb >= 7) st[2] = 'completed'; else if (c.stage === 'onb' && c.onb >= 4) st[2] = 'active';
    if (c.stage === 'app') {
      const order = ['home', 'merchant', 'product', 'cart', 'recipient', 'payment', 'checkout'];
      const idx = { home: 3, explore: 3, cat: 3, merchant: 4, cart: 6, recipient: 7, payment: 8, schedule: 9, checkout: 9 }[top] || 3;
      for (let i = 3; i < idx; i++) st[i] = 'completed';
      st[idx] = S.sheet && S.sheet.kind === 'product' ? 'completed' : 'active';
      if (S.sheet && S.sheet.kind === 'product') st[5] = 'active';
      void order;
    } else st[1] = c.stage === 'splash' ? 'active' : 'completed';
    return st;
  }
  for (let i = 1; i <= 9; i++) st[i] = 'completed';
  if (o.rcp.mode !== 'other') st[7] = 'completed';
  const S2 = o.st; const phase = o.cap && o.cap.phase;
  const done = (n) => { st[n] = 'completed'; }; const act = (n) => { st[n] = 'active'; };
  if (S2 === 'placed') act(10);
  if (['accepted', 'preparing', 'ready', 'picked_up', 'in_transit', 'delivered', 'completed', 'reattempt'].includes(S2)) done(10);
  if (S2 === 'accepted') act(11);
  if (S2 === 'preparing') act(11);
  if (['ready', 'picked_up', 'in_transit', 'delivered', 'completed', 'reattempt'].includes(S2)) done(11);
  if (o.offer) act(12); if (o.kid) done(12);
  if (phase === 'at_merchant') act(13);
  if (['picked_up', 'in_transit', 'delivered', 'completed', 'reattempt'].includes(S2)) done(13);
  if (phase === 'to_customer') act(14);
  if (['at_customer', 'waiting_ops'].includes(phase) || ['delivered', 'completed'].includes(S2)) done(14);
  if (phase === 'at_customer') act(15);
  if (['delivered', 'completed'].includes(S2)) { done(15); done(16); done(17); }
  if (phase === 'at_customer' && o.handover) act(16);
  if (S2 === 'delivered' && !o.rating) act(18); if (o.rating) done(18);
  if (o.cnd && isActive(o)) { st[15] = o.gate ? 'blocked' : 'failed'; st[16] = 'blocked'; st[17] = 'blocked'; }
  if (S2 === 'cancelled') { for (let i = 10; i <= 18; i++) if (st[i] !== 'completed') st[i] = 'failed'; if (o.label) { st[15] = 'failed'; } }
  if (S2 === 'failed_delivery') { for (let i = 15; i <= 18; i++) st[i] = 'failed'; }
  if (o.changeIssue && !['delivered', 'completed'].includes(S2)) st[16] = 'blocked';
  if (o.lines.some((l) => l.state === 'out') && o.pending.some((a) => a.kind === 'c_sub')) st[11] = 'blocked';
  return st;
}

/* ---------------------------------------------------------------- director cue: what the person at the keyboard should do now */
function scriptHint(o, a) {
  const sc = o.script || {};
  if (a.kind === 'c_handover' && sc.atDoor) return { refuse: L(`في السيناريو: العميل بيقول للكابتن «${sc.words || 'مش عايزه'}»`, `Scenario: the customer says “${sc.words || 'I don’t want it'}”`), no_answer: L('في السيناريو: العميل مش بيرد على الكابتن', 'Scenario: the customer does not answer'), wrong_address: L('في السيناريو: الكابتن وصل لأرض فاضية — العنوان غلط', 'Scenario: wrong address'), recipient_refuse: L('في السيناريو: المستلمة بتقول «أنا ماطلبتش حاجة»', 'Scenario: the recipient refuses'), not_home: L('في السيناريو: العميل برّه البيت', 'Scenario: the customer is not home') }[sc.atDoor] || null;
  if (a.kind === 'k_offer' && sc.rejectFirst && a.kid === sc.captain && !o.offers.some((x) => x.res === 'rejected')) return L('في السيناريو: أول كابتن بيرفض العرض', 'Scenario: the first captain declines');
  if (a.kind === 'm_ready' && sc.merchantLate && !o.lateNotified) return L('في السيناريو: المطعم متأخر في التحضير', 'Scenario: the kitchen runs late');
  if (a.kind === 'm_accept' && sc.merchantNoResponse) return L('في السيناريو: المطعم مش بيرد على الطلب', 'Scenario: the store does not respond');
  return null;
}
function cueFor(role) {
  const mine = pendingFor(role).filter(({ o, a }) => userControls(o, a));
  if (!mine.length) return null;
  mine.sort((x, y) => x.a.due - y.a.due);
  const { o, a } = mine[0];
  return { o, a, hint: scriptHint(o, a), gated: GATED.has(a.kind), more: mine.length - 1 };
}

function gotoFinding(f) {

    customer: () => {
      S.cust.stage = 'app';
      const scr = { login: () => { S.cust.stage = 'auth'; S.cust.verifyStep = 0; S.cust.authMode = 'phone'; }, verify: () => { S.cust.stage = 'auth'; S.cust.verifyStep = 1; }, signup: () => { S.cust.stage = 'auth'; S.cust.verifyStep = 0; S.cust.authMode = 'signup'; }, 'onb-perm': () => { S.cust.stage = 'onb'; S.cust.onb = 4; }, locate: () => { S.cust.stage = 'onb'; S.cust.onb = 5; }, 'addr-form': () => { S.cust.stage = 'onb'; S.cust.onb = 6; }, service: () => { S.cust.stage = 'onb'; S.cust.onb = 7; } }[f.screen];
      if (scr) { scr(); return; }
      const tabOf = { home: 'home', merchant: 'home', product: 'home', cart: 'home', recipient: 'home', schedule: 'home', checkout: 'home', payment: 'home', track: 'orders', rate: 'orders', receipt: 'orders', ticket: 'orders', complaint: 'orders', help: 'orders', assistant: 'assistant', settings: 'account', privacy: 'account', notifs: 'account' }[f.screen] || 'home';

      if (['cart', 'checkout', 'recipient', 'schedule', 'payment'].includes(f.screen)) { if (!S.cust.cart.lines.length) S.cust.cart = { mid: 'm1', lines: deepClone(FLAG_LINES).map((l) => Object.assign(l, { unitSeen: unitPrice(l.pid, l.opts) })), note: '', promo: '', extra: [] }; st.push({ s: 'cart' }); if (f.screen !== 'cart') st.push({ s: f.screen }); }

    captain: () => { S.nav.captain.loggedIn = true; const tab = { 'k-earn': 'earnings', 'k-custody': 'custody', 'k-account': 'account' }[f.screen] || 'home'; S.nav.captain.tab = tab; const trip = myTrip(); if (f.screen === 'k-trip' && trip) S.nav.captain.stacks.home = [{ s: 'k_home' }, { s: 'k_trip', id: trip.id }]; },
    support: () => { S.nav.support.view = f.screen === 'templates' ? 'templates' : f.screen === 'rules' ? 'rules' : 'tickets'; },
    ops: () => { S.nav.ops.view = ['incidents', 'log', 'blocked', 'map', 'people'].includes(f.screen) ? f.screen : 'live'; },
    finance: () => { S.nav.finance.view = ['recon', 'refunds', 'model'].includes(f.screen) ? f.screen : 'orders'; },
    admin: () => { S.nav.admin.view = ['values', 'catalog', 'roles', 'audit', 'areas'].includes(f.screen) ? f.screen : 'flags'; },
    recipient: () => {},

/* ---------------------------------------------------------------- screen resolution per role */
function resolveScreen(role) {
  if (role === 'customer') {
    const c = S.cust;
    if (c.stage === 'splash') return SCR.c_splash();
    if (c.stage === 'onb') return SCR.c_onb();
    if (c.stage === 'auth') return SCR.c_login();
    const top = topOf('customer'); const fn = SCR[top.s] || SCR.home;
    return fn(top);
  }
  if (role === 'merchant') {
    if (!S.nav.merchant.loggedIn) return SCR.m_login();
    const top = topOf('merchant'); return (SCR[top.s] || SCR.m_orders)(top);
  }
  if (role === 'captain') {
    if (!S.nav.captain.loggedIn) return SCR.k_login();
